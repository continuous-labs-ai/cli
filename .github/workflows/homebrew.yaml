name: Publish Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Latest public stable release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'continuous-labs-ai/cli' && (github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Verify the published formula and archives
        run: python3 scripts/publish_homebrew.py prepare --tag "$RELEASE_TAG" --formula "$RUNNER_TEMP/homebrew/continuous.rb"
      - name: Copy the exact formula into the tap
        run: python3 scripts/publish_homebrew.py publish --tag "$RELEASE_TAG" --formula "$RUNNER_TEMP/homebrew/continuous.rb"
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
