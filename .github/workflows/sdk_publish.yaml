# Vendored from speakeasy-api/sdk-generation-action .github/workflows/sdk-publish.yaml
# at v15 (68f3bfef): its CLI job pins a goreleaser-action commit that does not
# exist. Deliberate differences: the corrected pin, the setup-go version comment
# corrected to the tag its SHA carries, the action called directly instead of
# checked out into _speakeasy, no Slack steps, the reusable inputs inlined, and
# the owned dispatch-reference job.
# Return to the reusable workflow call once upstream fixes the pin.
name: Publish
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  push:
    branches:
      - main
    paths:
      - .speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  release:
    name: Create Github Release
    runs-on: ubuntu-22.04
    outputs:
      publish_cli: ${{ steps.release.outputs.publish_cli }}
      cli_regenerated: ${{ steps.release.outputs.cli_regenerated }}
      cli_directory: ${{ steps.release.outputs.cli_directory }}
      cli_goreleaser_current_tag: ${{ steps.release.outputs.cli_goreleaser_current_tag }}
      cli_goreleaser_previous_tag: ${{ steps.release.outputs.cli_goreleaser_previous_tag }}
    steps:
      - id: release
        uses: speakeasy-api/sdk-generation-action@fa50f4813201c6f919c74c25196b17c070ec4ac1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          action: "release"
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          target: continuous-simulation-cli
          enable_sdk_changelog: true
      - id: log-result
        uses: speakeasy-api/sdk-generation-action@fa50f4813201c6f919c74c25196b17c070ec4ac1
        if: always()
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          action: log-result
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          GH_ACTION_VERSION: fa50f4813201c6f919c74c25196b17c070ec4ac1
          GH_ACTION_STEP: ${{ github.job }}
          TARGET_TYPE: "sdk"
  publish-cli:
    if: ${{ needs.release.outputs.cli_regenerated == 'true' && needs.release.outputs.publish_cli == 'true' }}
    name: Publish CLI Target
    runs-on: ubuntu-22.04
    needs: release
    defaults:
      run:
        working-directory: ${{ needs.release.outputs.cli_directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: ${{ needs.release.outputs.cli_directory }}/go.mod
          cache: true
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          install-only: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v5.2.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.CLI_GPG_SECRET_KEY }}
          passphrase: ${{ secrets.CLI_GPG_PASSPHRASE }}
      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GORELEASER_CURRENT_TAG: ${{ needs.release.outputs.cli_goreleaser_current_tag }}
        run: |
          if [ -n "${{ needs.release.outputs.cli_goreleaser_previous_tag }}" ]; then
            export GORELEASER_PREVIOUS_TAG="${{ needs.release.outputs.cli_goreleaser_previous_tag }}"
          fi
          goreleaser release --clean
      - id: publish-event
        uses: speakeasy-api/sdk-generation-action@fa50f4813201c6f919c74c25196b17c070ec4ac1
        if: always()
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          action: publish-event
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          target_directory: ${{ needs.release.outputs.cli_directory }}
          registry_name: "go"
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          GH_ACTION_VERSION: fa50f4813201c6f919c74c25196b17c070ec4ac1
      - id: log-result
        uses: speakeasy-api/sdk-generation-action@fa50f4813201c6f919c74c25196b17c070ec4ac1
        if: always()
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          action: log-result
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          GH_ACTION_VERSION: fa50f4813201c6f919c74c25196b17c070ec4ac1
          GH_ACTION_STEP: ${{ github.job }}
          TARGET_TYPE: "sdk"
  dispatch-reference:
    name: Update the Continuous CLI reference
    runs-on: ubuntu-22.04
    needs: [release, publish-cli]
    permissions: {}
    steps:
      - name: Mint a contents token for continuous-labs-ai/continuous
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PINS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PINS_APP_PRIVATE_KEY }}
          owner: continuous-labs-ai
          repositories: continuous
          permission-contents: write
      - name: Dispatch cli-release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.release.outputs.cli_goreleaser_current_tag }}
        run: |
          [[ -n $TAG ]] || { echo "::error::The release job reported no CLI tag."; exit 1; }
          gh api repos/continuous-labs-ai/continuous/dispatches \
            -f event_type=cli-release -f "client_payload[tag]=$TAG"
