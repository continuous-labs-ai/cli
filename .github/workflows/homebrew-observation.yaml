name: Homebrew observation

on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.18.1
          args: release --snapshot --clean --skip=publish --release-notes release-notes/v0.1.0.md
      - run: python3 .github/observations/publication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebrew-formula-observation
          if-no-files-found: error
          path: |
            dist/homebrew/**
            dist/checksums.txt
            dist/*.tar.gz

  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: homebrew-formula-observation
          path: ${{ runner.temp }}/homebrew-package
      - name: Install the generated formula with packaged archives
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          uname -m
          brew --version
          brew tap-new observation/local
          ruby .github/observations/local_formula.rb "$RUNNER_TEMP/homebrew-package" "$(brew --repository observation/local)/Formula/continuous.rb"
          brew install --formula observation/local/continuous
          continuous version
          package_prefix="$(brew --prefix continuous)"
          test -s "$package_prefix/share/continuous/LICENSE"
          test -s "$package_prefix/share/continuous/THIRD_PARTY_NOTICES.md"
          test -s "$package_prefix/share/continuous/THIRD_PARTY_NOTICES/go/LICENSE"
          test -s "$package_prefix/share/continuous/THIRD_PARTY_NOTICES/go/PATENTS"
          test -s "$package_prefix/etc/bash_completion.d/continuous"
          test -s "$package_prefix/share/zsh/site-functions/_continuous"
          test -s "$package_prefix/share/fish/vendor_completions.d/continuous.fish"
          bash -n "$package_prefix/etc/bash_completion.d/continuous"
          zsh -n "$package_prefix/share/zsh/site-functions/_continuous"
          brew reinstall --formula observation/local/continuous
          continuous version
