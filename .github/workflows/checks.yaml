name: Checks

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  generation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Install pinned Speakeasy CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/speakeasy.zip" https://github.com/speakeasy-api/speakeasy/releases/download/v1.796.4/speakeasy_linux_amd64.zip
          echo "fc67f38e215eba0d00a78dc187fc82b8402f6e6585500ea0445541084150b2f4  $RUNNER_TEMP/speakeasy.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/speakeasy.zip" speakeasy -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Regenerate from pinned local source without registry upload
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: |
          speakeasy run --target continuous-simulation-cli --skip-upload-spec --skip-versioning --skip-testing --skip-compile
          go mod tidy
          tar --exclude=.git -czf "$RUNNER_TEMP/generated.tar.gz" .
      - name: Upload generated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-candidate
          path: ${{ runner.temp }}/generated.tar.gz
          if-no-files-found: error
      - name: Check generated source drift
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  build-package:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-locks
          path: |
            go.mod
            go.sum
      - run: go vet ./...
      - run: go build -o dist/continuous ./cmd/continuous
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.18.1
          args: release --snapshot --clean --skip=publish,sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packaging
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  all-green:
    name: All green
    if: always()
    needs: [build-package, generation]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.build-package.result }}
          GENERATION_RESULT: ${{ needs.generation.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          test "$RESULT" = success
          if [ "$IS_FORK" != true ]; then
            test "$GENERATION_RESULT" = success
          fi
