name: Checks

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  generation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@68f3bfefb79354d39358bf4699863dabd2cea0f6
    with:
      mode: test
      target: continuous-simulation-cli
      force: "true"
      skip_versioning: "true"
      skip_testing: true
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}

  build-package:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-locks
          path: |
            go.mod
            go.sum
      - run: go vet ./...
      - run: go build -o dist/continuous ./cmd/continuous
      - id: version
        run: |
          echo "version=$(sed -n 's/^  version: //p' .speakeasy/gen.yaml)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.18.1
          args: release --snapshot --clean --skip=publish --release-notes release-notes/v${{ steps.version.outputs.version }}.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packaging
          if-no-files-found: error
          path: |
            LICENSE
            third-party-notices.tar.gz
            legal-assets.sha256
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  all-green:
    name: All green
    if: always()
    needs: [build-package, generation]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.build-package.result }}
          GENERATION_RESULT: ${{ needs.generation.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          test "$RESULT" = success
          if [ "$IS_FORK" != true ]; then
            test "$GENERATION_RESULT" = success
          fi
