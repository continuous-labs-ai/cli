name: Checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  generation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@68f3bfefb79354d39358bf4699863dabd2cea0f6
    with:
      mode: test
      target: continuous-simulation-cli
      force: "true"
      skip_versioning: "true"
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o dist/continuous ./cmd/continuous
      - run: python3 tests/smoke.py dist/continuous

  all-green:
    name: All green
    if: always()
    needs: [build-test, generation]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.build-test.result }}
          GENERATION_RESULT: ${{ needs.generation.result }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          test "$RESULT" = success
          if [ "$IS_FORK" != true ]; then
            test "$GENERATION_RESULT" = success
          fi
