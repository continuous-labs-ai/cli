    post:
      description: Starts an asynchronous Simulator build and returns the Simulator with status building. Send multipart/form-data with a JSON part named request. To build from a document, add a file part named spec with the OpenAPI or WSDL document. For an incremental build, omit spec and set parent_id and instructions.
      operationId: build-simulator
      requestBody:
        content:
          multipart/form-data:
            encoding:
              request:
                contentType: application/json
              spec:
                contentType: application/octet-stream
            schema:
              additionalProperties: false
              properties:
                request:
                  $ref: "#/components/schemas/BuildSimulatorRequest"
                  description: Build options as JSON.
                spec:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  description: OpenAPI or WSDL document, UTF-8 encoded, at most 64 MiB. Required unless the request is an incremental build (parent_id and instructions, no spec).
                  format: binary
                  type: string
              required:
                - request
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulator"
          description: Accepted
        "400":
          content:
            application/problem+json:
              examples:
