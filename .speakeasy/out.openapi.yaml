                simulator_not_found:
                  $ref: "#/components/examples/simulator_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          content:
            application/problem+json:
              examples:
                validation:
                  $ref: "#/components/examples/validation"
              schema:
                $ref: "#/components/schemas/Error"
