components:
  examples:
    auth_forbidden_catalog:
      value:
        code: auth_forbidden
        detail: The Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" belongs to the Continuous catalog and cannot be changed.
    auth_forbidden_owner:
      value:
        code: auth_forbidden
        detail: Only the workspace that owns the Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" can cancel its build.
    auth_forbidden_simulation:
      value:
        code: auth_forbidden
        detail: The Simulation with ID "sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6" belongs to another workspace.
    auth_forbidden_simulator:
      value:
        code: auth_forbidden
        detail: The Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" belongs to another workspace.
    auth_forbidden_world:
      value:
        code: auth_forbidden
        detail: The World with ID "wld_01J8Z5X4K7M2N9P0Q1R2S3T4V7" belongs to another workspace.
    auth_invalid:
      value:
        code: auth_invalid
        detail: The authentication credential is invalid.
    auth_missing:
      value:
        code: auth_invalid
        detail: Authentication credentials are required.
    auth_provider_unavailable:
      value:
        code: auth_provider_unavailable
        detail: The authentication provider is unavailable. Retry the request after a short delay.
    bad_request:
      value:
        code: bad_request
        detail: The cursor is invalid.
    bad_request_body:
      value:
        code: bad_request
        detail: request body is invalid
    build_quota_exceeded:
      value:
        code: build_quota_exceeded
        detail: The workspace has 2 active Simulator builds and a limit of 2. Wait for a build to finish or ask an operator to increase the limit.
    build_rate_exceeded:
      value:
        code: build_rate_exceeded
        detail: The workspace has used 10 of its limit of 10 Simulator builds for the current UTC day. The limit resets at the next UTC midnight.
    build_storage_unavailable:
      value:
        code: internal_unavailable
        detail: simulator spec storage is unavailable
    clock_advance_not_found:
      value:
        code: clock_advance_not_found
        detail: The clock advance was not found.
    clock_conflict:
      value:
        code: clock_conflict
        detail: A clock advance is active.
    internal:
      value:
        code: internal
        detail: The server encountered an unexpected error.
    internal_unavailable:
      value:
        code: internal_unavailable
        detail: The service is temporarily unavailable. Retry the request after a short delay.
    payload_too_large:
      value:
        code: payload_too_large
        detail: The request body exceeds the maximum allowed size.
    request_timeout:
      value:
        code: request_timeout
        detail: The request body was not received before the timeout. Retry the request.
    simulation_capacity:
      value:
        code: simulation_capacity
        detail: Continuous has no available Simulation capacity. Retry after a short delay.
    simulation_not_found:
      value:
        code: simulation_not_found
        detail: No Simulation was found with ID "sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6".
    simulation_platform_owned:
      value:
        code: simulation_world_owned
        detail: The Simulation with ID "sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6" is in use by the platform and cannot be changed.
    simulation_provider_unavailable:
      value:
        code: simulation_provider_unavailable
        detail: The Simulation runtime provider is unavailable. Retry the request after a short delay.
    simulation_quota_exceeded:
      value:
        code: simulation_quota_exceeded
        detail: The workspace has 5 active Simulations and a limit of 5. Stop a Simulation or wait for one to be deleted.
    simulation_quota_exceeded_world:
      value:
        code: simulation_quota_exceeded
        detail: The workspace has 4 of its 5 Simulation slots in use and cannot start all 3 World Simulations. Stop other Simulations or wait for one to be deleted.
    simulation_stopped:
      value:
        code: simulation_stopped
        detail: The Simulation with ID "sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6" is stopped. Start it before you retry this request.
    simulation_template_missing:
      value:
        code: simulation_template_missing
        detail: The Simulation runtime template is unavailable. Contact Continuous support before you retry the request.
    simulation_timeout:
      value:
        code: simulation_timeout
        detail: The Simulation runtime did not start before the timeout. Retry the request.
    simulation_world_owned:
      value:
        code: simulation_world_owned
        detail: The Simulation with ID "sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6" belongs to the World with ID "wld_01J8Z5X4K7M2N9P0Q1R2S3T4V7". Manage it through the World.
    simulator_in_use:
      value:
        code: simulator_in_use
        detail: The Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" has dependent Worlds, Simulations, or child Simulators. Delete those resources before you delete this Simulator.
    simulator_not_found:
      value:
        code: simulator_not_found
        detail: No Simulator was found with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5".
    simulator_not_ready:
      value:
        code: simulator_not_ready
        detail: The Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" is not ready. Use a ready Simulator before you retry.
    simulator_not_ready_base:
      value:
        code: simulator_not_ready
        detail: The base Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" is not ready. Use a ready Simulator before you retry.
    simulator_unknown:
      value:
        code: simulator_unknown
        detail: The Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" is unknown or belongs to another workspace.
    simulator_unknown_parent:
      value:
        code: simulator_unknown
        detail: The parent Simulator with ID "smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5" is unknown or belongs to another workspace.
    unsupported_media_type:
      value:
        code: unsupported_media_type
        detail: The request Content-Type is not supported.
    validation_build_simulator:
      value:
        code: validation
        detail: a build requires a spec, or parent_id + instructions for an incremental build
    validation_build_world:
      value:
        code: validation
        detail: instructions must not be blank
    validation_clock_time:
      value:
        code: validation
        detail: time must be after 0001-01-01T00:00:00Z and before year 10000, with at most millisecond precision
    validation_fork_simulation:
      value:
        code: validation
        detail: at_step does not identify a recorded step
    validation_list_limit:
      value:
        code: validation
        detail: "validation failed: invalid integer at query.limit"
    validation_mint_simulation_token:
      value:
        code: validation
        detail: "validation failed: expected number >= 60 at body.ttl_seconds"
    validation_simulator_id:
      value:
        code: validation
        detail: The Simulator ID must be a stable smr_ ID.
    world_conflict:
      value:
        code: world_conflict
        detail: The World with ID "wld_01J8Z5X4K7M2N9P0Q1R2S3T4V7" is in the failed state and cannot be started.
    world_conflict_stop:
      value:
        code: world_conflict
        detail: The World with ID "wld_01J8Z5X4K7M2N9P0Q1R2S3T4V7" is in the failed state and cannot be stopped.
    world_not_found:
      value:
        code: world_not_found
        detail: No World was found with ID "wld_01J8Z5X4K7M2N9P0Q1R2S3T4V7".
  responses:
    InternalServerError:
      content:
        application/problem+json:
          examples:
            internal:
              $ref: "#/components/examples/internal"
          schema:
            $ref: "#/components/schemas/Error"
      description: Internal Server Error
    PayloadTooLarge:
      content:
        application/problem+json:
          examples:
            payload_too_large:
              $ref: "#/components/examples/payload_too_large"
          schema:
            $ref: "#/components/schemas/Error"
      description: Request Entity Too Large
    RequestTimeout:
      content:
        application/problem+json:
          examples:
            request_timeout:
              $ref: "#/components/examples/request_timeout"
          schema:
            $ref: "#/components/schemas/Error"
      description: Request Timeout
    Unauthorized:
      content:
        application/problem+json:
          examples:
            auth_invalid:
              $ref: "#/components/examples/auth_invalid"
            auth_missing:
              $ref: "#/components/examples/auth_missing"
          schema:
            $ref: "#/components/schemas/Error"
      description: Unauthorized
    UnsupportedMediaType:
      content:
        application/problem+json:
          examples:
            unsupported_media_type:
              $ref: "#/components/examples/unsupported_media_type"
          schema:
            $ref: "#/components/schemas/Error"
      description: Unsupported Media Type
  schemas:
    AdvanceTimeInputBody:
      additionalProperties: false
      properties:
        to:
          description: Absolute target time in RFC 3339, with at most millisecond precision.
          format: date-time
          type: string
      required:
        - to
      type: object
    BuildSimulatorRequest:
      additionalProperties: false
      examples:
        - builder: claude
          filter: []
          instructions: Return stable example data for every operation.
          name: billing-api
          spec_kind: openapi
      properties:
        builder:
          default: claude
          description: Model provider that builds the Simulator. Defaults to claude.
          enum:
            - openai
            - claude
          type: string
        filter:
          default: []
          description: Regular expressions (RE2 syntax) that select the operations to implement. Each is matched against the OpenAPI operationId or the WSDL operation name; an operation is kept when any expression matches, and an OpenAPI operation without an operationId is dropped. At most 64 expressions of at most 1,024 characters each. Omit or send an empty list to keep every operation. Not allowed for an incremental build.
          items:
            maxLength: 1024
            type: string
          maxItems: 64
          type: array
        instructions:
          description: Instructions for the builder. Required for an incremental build. At most 16,384 characters and 65,536 UTF-8 bytes; must not be blank or contain U+0000.
          maxLength: 16384
          type: string
        name:
          description: Optional Simulator name. Names cannot start with smr_. Omission generates a name.
          maxLength: 128
          pattern: ^$|^(?!smr_)[a-z0-9]+(?:[._-][a-z0-9]+)*$
          type: string
        parent_id:
          description: "Parent Simulator ID. With instructions and no spec this starts an incremental build: the parent must be ready, and the request takes no filter or spec_kind."
          maxLength: 30
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        spec_kind:
          description: Source specification format. Omission detects the format.
          enum:
            - openapi
            - wsdl
          type: string
      type: object
    BuildWorldRequest:
      additionalProperties: false
      examples:
        - instructions: Use stable example data for each Simulator.
          simulators:
            - smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5
      properties:
        builder:
          default: claude
          description: Model provider that builds starting data. Defaults to claude.
          enum:
            - openai
            - claude
          type: string
        instructions:
          description: Describe the initial data, scenario, and relationships. Populated Worlds support up to 8 selected Simulators and 1,000 starting records in total. Named record types replace their default data. At most 16,384 characters and 65,536 UTF-8 bytes. U+0000 is not permitted.
          maxLength: 16384
          type: string
        simulators:
          description: Simulator IDs for the World.
          items:
            pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          minItems: 1
          type: array
      required:
        - simulators
      type: object
    ClockAdvance:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ResourceError"
          description: Safe execution failure, or null when no failure is recorded.
        event_count:
          description: Number of committed event executions.
          format: int64
          minimum: 0
          type: integer
        from:
          description: Clock before the requested advance.
          format: date-time
          type: string
        id:
          description: Stable clock advance operation ID.
          pattern: ^adv_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        members:
          description: Progress for each participating Simulation.
          items:
            $ref: "#/components/schemas/ClockAdvanceMember"
          type: array
        status:
          description: Durable operation state. Poll while pending or running.
          enum:
            - pending
            - running
            - completed
            - failed
          type: string
        step:
          description: Committed local step, or null for no change or a World operation.
          format: int64
          type:
            - integer
            - "null"
        to:
          description: Requested absolute target time.
          format: date-time
          type: string
      required:
        - id
        - status
        - from
        - to
        - event_count
        - step
        - members
        - error
      type: object
    ClockAdvanceMember:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ResourceError"
          description: Safe execution failure, or null when no failure is recorded.
        event_count:
          description: Number of committed event executions.
          format: int64
          minimum: 0
          type: integer
        simulation_id:
          description: Member Simulation ID.
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        status:
          description: Whether this member is pending, committed, or rolled back after a deterministic failure.
          enum:
            - pending
            - completed
            - failed
          type: string
        step:
          description: Committed local step, or null for no change or a failed advance.
          format: int64
          type:
            - integer
            - "null"
      required:
        - simulation_id
        - status
        - event_count
        - step
        - error
      type: object
    ClockEvent:
      additionalProperties: false
      properties:
        at:
          description: Simulated time observed by this event handler.
          format: date-time
          type: string
        event_id:
          description: Scheduled event ID.
          type: string
        sequence:
          description: Persisted insertion order for events due at the same time.
          format: int64
          type: integer
        type:
          description: Declared event type.
          type: string
      required:
        - event_id
        - type
        - at
        - sequence
      type: object
    CreateSimulationRequest:
      additionalProperties: false
      examples:
        - name: billing-sandbox
          simulator_id: smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5
      properties:
        name:
          description: Optional Simulation name. Omission generates a name.
          maxLength: 64
          pattern: ^$|^[a-z][a-z0-9-]*$
          type: string
        simulator_id:
          description: ID of the ready Simulator.
          minLength: 1
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        start_time:
          description: Initial simulated time in RFC 3339 format. Omission uses 2024-01-01T00:00:00Z. Precision is milliseconds.
          format: date-time
          type: string
      required:
        - simulator_id
      type: object
    CreatedSimulation:
      additionalProperties: false
      examples:
        - active_advance_id: null
          created_at: "2026-01-15T12:00:00Z"
          current_time: "2024-01-01T00:00:00Z"
          endpoint: https://api.continuouslabs.ai/sim/sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6
          expires_at: "2026-01-15T13:00:00Z"
          id: sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6
          name: billing-sandbox
          parent_id: sim_01J8Z5X4K7M2N9P0Q1R2S3T4V8
          simulator_id: smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5
          start_time: "2024-01-01T00:00:00Z"
          status: running
          token: <redacted>
      properties:
        active_advance_id:
          description: Current clock advance operation ID, or null.
          type:
            - string
            - "null"
        created_at:
          description: Simulation creation time.
          format: date-time
          type: string
        current_time:
          description: Current simulated time.
          format: date-time
          type: string
        endpoint:
          description: Base URL for requests to the Simulation.
          format: uri
          type: string
        expires_at:
          description: Token expiration time.
          format: date-time
          type: string
        id:
          description: Simulation ID.
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        name:
          description: Simulation name.
          maxLength: 64
          pattern: ^[a-z][a-z0-9-]*$
          type: string
        parent_id:
          description: Source Simulation ID for a fork, or null.
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        simulator_id:
          description: ID of the Simulator.
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        start_time:
          description: Initial simulated time.
          format: date-time
          type: string
        status:
          description: Current status. running serves requests. paused means the Simulation was idle and the platform paused it; the next request wakes it. stopped means its state is saved and requests return 409 until you start it.
          enum:
            - running
            - paused
            - stopped
          type: string
        token:
          description: Token for requests to the Simulation endpoint. Send it in the X-Continuous-Simulation-Token header. It is returned only here; list and get omit it. Create more with POST /v1/simulations/{id}/tokens.
          type: string
      required:
        - start_time
        - current_time
        - active_advance_id
        - id
        - name
        - simulator_id
        - parent_id
        - status
        - endpoint
        - token
        - expires_at
        - created_at
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          minLength: 1
          type: string
        detail:
          description: Safe human-readable error detail.
          minLength: 1
          type: string
      required:
        - code
        - detail
      type: object
    ForkSimulationRequest:
      additionalProperties: false
      examples:
        - at_step: 42
          name: billing-fork
      properties:
        at_step:
          description: Completed step to fork from. Omission forks from the latest state.
          format: int64
          maximum: 9.007199254740991e+15
          minimum: 0
          type: integer
        name:
          description: Optional child Simulation name. Omission generates a name.
          maxLength: 64
          pattern: ^$|^[a-z][a-z0-9-]*$
          type: string
      type: object
    ListAdvanceEventsOutputBody:
      additionalProperties: false
      properties:
        events:
          description: Committed events in execution order.
          items:
            $ref: "#/components/schemas/ClockEvent"
          type: array
        next_cursor:
          description: Cursor for the next page, or null.
          type:
            - string
            - "null"
      required:
        - events
        - next_cursor
      type: object
    ListSimulationStepsResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: Cursor for the next page, or null.
          type:
            - string
            - "null"
        steps:
          description: Recorded steps in this page.
          items:
            $ref: "#/components/schemas/Step"
          type: array
      required:
        - steps
        - next_cursor
      type: object
    ListSimulationsResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: Cursor for the next page, or null.
          type:
            - string
            - "null"
        simulations:
          description: Simulations in this page.
          items:
            $ref: "#/components/schemas/Simulation"
          type: array
      required:
        - simulations
        - next_cursor
      type: object
    ListSimulatorsResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: Cursor for the next page, or null.
          type:
            - string
            - "null"
        simulators:
          description: Simulators in this page.
          items:
            $ref: "#/components/schemas/Simulator"
          type: array
      required:
        - simulators
        - next_cursor
      type: object
    ListWorldsResponse:
      additionalProperties: false
      properties:
        next_cursor:
          description: Cursor for the next page, or null.
          type:
            - string
            - "null"
        worlds:
          description: Worlds in this page.
          items:
            $ref: "#/components/schemas/World"
          type: array
      required:
        - worlds
        - next_cursor
      type: object
    MintSimulationTokenRequest:
      additionalProperties: false
      examples:
        - ttl_seconds: 3600
      properties:
        ttl_seconds:
          description: Token lifetime in seconds, from 60 through 86,400.
          format: int64
          maximum: 86400
          minimum: 60
          type: integer
      required:
        - ttl_seconds
      type: object
    ResourceError:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          type: string
        detail:
          description: Safe human-readable error detail.
          type: string
      required:
        - code
        - detail
      type:
        - object
        - "null"
    Simulation:
      additionalProperties: false
      examples:
        - active_advance_id: null
          created_at: "2026-01-15T12:00:00Z"
          current_time: "2024-01-01T00:00:00Z"
          endpoint: https://api.continuouslabs.ai/sim/sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6
          id: sim_01J8Z5X4K7M2N9P0Q1R2S3T4V6
          name: billing-sandbox
          parent_id: sim_01J8Z5X4K7M2N9P0Q1R2S3T4V8
          simulator_id: smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5
          start_time: "2024-01-01T00:00:00Z"
          status: running
      properties:
        active_advance_id:
          description: Current clock advance operation ID, or null.
          type:
            - string
            - "null"
        created_at:
          description: Simulation creation time.
          format: date-time
          type: string
        current_time:
          description: Current simulated time.
          format: date-time
          type: string
        endpoint:
          description: Base URL for requests to the Simulation.
          format: uri
          type: string
        id:
          description: Simulation ID.
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        name:
          description: Simulation name.
          maxLength: 64
          pattern: ^[a-z][a-z0-9-]*$
          type: string
        parent_id:
          description: Source Simulation ID for a fork, or null.
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        simulator_id:
          description: ID of the Simulator.
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        start_time:
          description: Initial simulated time.
          format: date-time
          type: string
        status:
          description: Current status. running serves requests. paused means the Simulation was idle and the platform paused it; the next request wakes it. stopped means its state is saved and requests return 409 until you start it.
          enum:
            - running
            - paused
            - stopped
          type: string
      required:
        - start_time
        - current_time
        - active_advance_id
        - id
        - name
        - simulator_id
        - parent_id
        - status
        - endpoint
        - created_at
      type: object
    SimulationToken:
      additionalProperties: false
      examples:
        - expires_at: "2026-01-15T13:00:00Z"
          token: <redacted>
      properties:
        expires_at:
          description: Token expiration time.
          format: date-time
          type: string
        token:
          description: New token for requests to the Simulation endpoint. Send it in the X-Continuous-Simulation-Token header.
          type: string
      required:
        - token
        - expires_at
      type: object
    Simulator:
      additionalProperties: false
      examples:
        - build:
            builder: claude
            last_submission: rejected
            last_tool: test
            stage: build
            submissions: 1
            tool_calls: 7
            updated_at: "2026-01-15T12:05:00Z"
          created_at: "2026-01-15T12:00:00Z"
          error: null
          id: smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5
          name: billing-api
          parent_id: smr_01J8Z5X4K7M2N9P0Q1R2S3T4V9
          source: workspace
          status: building
      properties:
        build:
          description: The build's latest progress report, or null before the first report. A terminal Simulator keeps its last report.
          oneOf:
            - $ref: "#/components/schemas/SimulatorBuildProgress"
            - type: "null"
        created_at:
          description: Simulator creation time.
          format: date-time
          type: string
        error:
          $ref: "#/components/schemas/SimulatorError"
          description: Why the build failed or was canceled, or null.
        id:
          description: Simulator ID.
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        name:
          description: Simulator name. Names cannot start with smr_.
          maxLength: 128
          pattern: ^(?!smr_)[a-z0-9]+(?:[._-][a-z0-9]+)*$
          type: string
        parent_id:
          description: Parent Simulator ID, or null.
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        source:
          description: workspace for a Simulator your workspace built; catalog for a read-only Simulator that Continuous publishes.
          enum:
            - workspace
            - catalog
          type: string
        status:
          description: building while the build runs; ready when Simulations, Worlds, and incremental builds can use it; failed when the build failed; canceled when a cancel request took effect.
          enum:
            - building
            - ready
            - failed
            - canceled
          type: string
      required:
        - id
        - name
        - source
        - parent_id
        - status
        - error
        - created_at
        - build
      type: object
    SimulatorBuildProgress:
      additionalProperties: false
      properties:
        builder:
          description: The coding-loop provider.
          enum:
            - claude
            - openai
          type: string
        last_submission:
          description: Outcome of the most recent submit attempt, or null.
          enum:
            - accepted
            - rejected
            - null
          type:
            - string
            - "null"
        last_tool:
          description: Name of the most recent tool call, or null.
          type:
            - string
            - "null"
        stage:
          description: derive while the effective spec, build skeleton, and sandbox are prepared; build while the coding loop runs; assemble while an accepted artifact publishes.
          enum:
            - derive
            - build
            - assemble
          type: string
        submissions:
          description: Submit attempts.
          format: int64
          type: integer
        tool_calls:
          description: Tool calls the coding loop executed.
          format: int64
          type: integer
        updated_at:
          description: Time of the last progress report.
          format: date-time
          type: string
      required:
        - builder
        - stage
        - tool_calls
        - submissions
        - last_tool
        - last_submission
        - updated_at
      type: object
    SimulatorError:
      additionalProperties: false
      properties:
        code:
          description: Stable Simulator build error code.
          enum:
            - build_failed
            - build_cancelled
          type: string
        detail:
          description: Safe human-readable error detail.
          type: string
      required:
        - code
        - detail
      type:
        - object
        - "null"
    StartWorldRequest:
      additionalProperties: false
      properties:
        start_time:
          description: Initial simulated time for the first Start, in RFC 3339 format. Omission uses 2024-01-01T00:00:00Z. Saved business dates remain unchanged. Later starts preserve the clock.
          format: date-time
          type: string
      type: object
    Step:
      additionalProperties: false
      properties:
        advance_id:
          description: Advance that produced this step, if any.
          type:
            - string
            - "null"
        kind:
          description: api for an API write or advance for a clock advance.
          enum:
            - api
            - advance
          type: string
        label:
          description: HTTP method and path of the request that produced this step, without the query string, for example POST /v1/widgets.
          type: string
        step:
          description: Step number. Use it as at_step when you fork.
          format: int64
          type: integer
        time_after:
          description: Clock after the step.
          format: date-time
          type:
            - string
            - "null"
        time_before:
          description: Clock before the step.
          format: date-time
          type:
            - string
            - "null"
      required:
        - kind
        - time_before
        - time_after
        - advance_id
        - step
        - label
      type: object
    World:
      additionalProperties: false
      examples:
        - active_advance_id: null
          created_at: "2026-01-15T12:00:00Z"
          current_time: "2024-01-01T00:00:00Z"
          error: null
          id: wld_01J8Z5X4K7M2N9P0Q1R2S3T4V7
          instructions: Use stable example data for each Simulator.
          simulations: []
          simulators:
            - smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5
          start_time: "2024-01-01T00:00:00Z"
          status: building
      properties:
        active_advance_id:
          description: Current clock advance operation ID, or null.
          type:
            - string
            - "null"
        build:
          $ref: "#/components/schemas/WorldBuild"
          description: Current build progress and verified starting data.
        created_at:
          description: Time when the World build started.
          format: date-time
          type: string
        current_time:
          description: Current shared simulated time.
          format: date-time
          type: string
        error:
          $ref: "#/components/schemas/WorldError"
          description: Safe failure information, or null when no failure exists.
        id:
          description: World ID.
          pattern: ^wld_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        instructions:
          description: Instructions for the initial synthetic data and relationships.
          type: string
        simulations:
          description: Created member Simulations. This list is empty before first start.
          items:
            $ref: "#/components/schemas/WorldSimulation"
          type: array
        simulators:
          description: Simulator IDs in member order.
          items:
            pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          type: array
        start_time:
          description: Initial simulated time. Before first Start this is the default time.
          format: date-time
          type: string
        status:
          description: building while the build runs; ready when it can be started; running or stopped once its Simulations exist; failed when building or first start fails; canceled when the build was canceled.
          enum:
            - building
            - ready
            - running
            - stopped
            - failed
            - canceled
          type: string
      required:
        - start_time
        - current_time
        - active_advance_id
        - id
        - status
        - simulators
        - instructions
        - simulations
        - error
        - created_at
      type: object
    WorldBuild:
      additionalProperties: false
      properties:
        builder:
          description: Selected model provider. Absent for builds created before provider selection.
          enum:
            - openai
            - claude
          type: string
        last_submission:
          description: Outcome of the most recent plan submission.
          enum:
            - accepted
            - rejected
          type: string
        last_tool:
          description: Name of the most recent tool. Tool arguments and output are private.
          type: string
        stage:
          description: Current phase of starting-data preparation.
          enum:
            - planning
            - generating
            - validating
            - complete
          type: string
        submissions:
          description: Number of submitted starting-data plans.
          format: int64
          minimum: 0
          type: integer
        summary:
          $ref: "#/components/schemas/WorldDataSummary"
          description: Verified starting data. Present only after a completed build.
        tool_calls:
          description: Number of agent tool calls.
          format: int64
          minimum: 0
          type: integer
      required:
        - stage
      type: object
    WorldDataSummary:
      additionalProperties: false
      properties:
        assumptions:
          description: Defaults and inferred choices used to prepare the starting data.
          items:
            type: string
          type: array
        conditions:
          description: Record conditions and counts computed from a complete census of served records.
          items:
            type: string
          type: array
        records:
          description: Observed starting record counts for each member and record type.
          items:
            $ref: "#/components/schemas/WorldRecordCount"
          type: array
        relationships:
          description: Shared relationships checked against the data and served API values.
          items:
            type: string
          type: array
      required:
        - records
        - relationships
        - conditions
        - assumptions
      type: object
    WorldError:
      additionalProperties: false
      properties:
        code:
          description: Stable World error code.
          enum:
            - world_build_canceled
            - world_start_failed
            - world_create_failed
            - world_failed
            - world_population_failed
            - world_population_unsupported
            - world_population_invalid
            - world_population_unavailable
          type: string
        detail:
          description: Safe human-readable error detail.
          type: string
      required:
        - code
        - detail
      type:
        - object
        - "null"
    WorldRecordCount:
      additionalProperties: false
      properties:
        count:
          description: Number of stored starting records of this type.
          format: int64
          type: integer
        entity:
          description: Record type reported by the Simulator.
          type: string
        member_index:
          description: Position in the selected Simulator list, starting at zero.
          format: int64
          type: integer
        simulator_id:
          description: Stable ID of the Simulator for this member.
          type: string
      required:
        - member_index
        - simulator_id
        - entity
        - count
      type: object
    WorldSimulation:
      additionalProperties: false
      properties:
        id:
          description: ID of the created Simulation.
          pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        simulator_id:
          description: ID of the Simulator that this Simulation runs.
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
      required:
        - id
        - simulator_id
      type: object
  securitySchemes:
    apiKeyAuth:
      bearerFormat: Continuous API key
      description: Use a Continuous API key. Send it in the Authorization header as a Bearer token.
      scheme: bearer
      type: http
info:
  description: Build Simulators from OpenAPI or WSDL documents, create Simulations from them, and build Worlds that run Simulations together. Authenticate every request with an API key sent as a Bearer token.
  title: Continuous Simulation API
  version: v1
openapi: 3.1.0
paths:
  /v1/simulations:
    get:
      description: Returns all Simulations that the API key can access. Results can be filtered by status or Simulator.
      operationId: list-simulations
      parameters:
        - description: Optional status filter.
          explode: false
          in: query
          name: status
          schema:
            enum:
              - running
              - paused
              - stopped
            type: string
        - description: Optional Simulator ID filter.
          explode: false
          in: query
          name: simulator_id
          schema:
            pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
        - description: Page size. Values below 1 use 50. Values above 200 use 200.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            type: integer
        - description: Opaque next_cursor value from a previous page.
          explode: false
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSimulationsResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                bad_request:
                  $ref: "#/components/examples/bad_request"
                simulator_unknown:
                  $ref: "#/components/examples/simulator_unknown"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          content:
            application/problem+json:
              examples:
                validation_list_limit:
                  $ref: "#/components/examples/validation_list_limit"
                validation_simulator_id:
                  $ref: "#/components/examples/validation_simulator_id"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: List Simulations
      tags:
        - simulations
    post:
      description: Creates a Simulation from a ready Simulator and starts it. The response includes the Simulation endpoint and a token that expires in 1 hour. List and get do not return the token.
      operationId: create-simulation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSimulationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSimulation"
          description: Created
        "400":
          content:
            application/problem+json:
              examples:
                bad_request_body:
                  $ref: "#/components/examples/bad_request_body"
                simulator_unknown:
                  $ref: "#/components/examples/simulator_unknown"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          content:
            application/problem+json:
              examples:
                simulator_not_ready:
                  $ref: "#/components/examples/simulator_not_ready"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          content:
            application/problem+json:
              examples:
                validation_simulator_id:
                  $ref: "#/components/examples/validation_simulator_id"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              examples:
                simulation_capacity:
                  $ref: "#/components/examples/simulation_capacity"
                simulation_quota_exceeded:
                  $ref: "#/components/examples/simulation_quota_exceeded"
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              examples:
                internal:
                  $ref: "#/components/examples/internal"
                simulation_template_missing:
                  $ref: "#/components/examples/simulation_template_missing"
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
                simulation_provider_unavailable:
                  $ref: "#/components/examples/simulation_provider_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "504":
          content:
            application/problem+json:
              examples:
                simulation_timeout:
                  $ref: "#/components/examples/simulation_timeout"
              schema:
                $ref: "#/components/schemas/Error"
          description: Gateway Timeout
      security:
        - apiKeyAuth: []
      summary: Create Simulation
      tags:
        - simulations
  /v1/simulations/{id}:
    delete:
      description: Deletes a Simulation and its saved runtime state. Delete World-owned Simulations through their World.
      operationId: delete-simulation
      parameters:
        - description: Simulation ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/problem+json:
              examples:
                auth_forbidden_simulation:
                  $ref: "#/components/examples/auth_forbidden_simulation"
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              examples:
                simulation_not_found:
                  $ref: "#/components/examples/simulation_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/problem+json:
              examples:
                clock_conflict:
                  $ref: "#/components/examples/clock_conflict"
                simulation_platform_owned:
                  $ref: "#/components/examples/simulation_platform_owned"
                simulation_world_owned:
                  $ref: "#/components/examples/simulation_world_owned"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Delete Simulation
      tags:
        - simulations
    get:
      description: Returns a Simulation and its current status. The response does not include tokens.
      operationId: get-simulation
      parameters:
        - description: Simulation ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/problem+json:
              examples:
                auth_forbidden_simulation:
                  $ref: "#/components/examples/auth_forbidden_simulation"
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              examples:
                simulation_not_found:
                  $ref: "#/components/examples/simulation_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Get Simulation
      tags:
        - simulations
  /v1/simulations/{id}/advance-time:
    post:
      description: Schedules an absolute clock advance. Each successful advance commits all due local events in one step. World members advance through their World. Poll the returned operation until it completes.
      operationId: advance-simulation-time
      parameters:
        - description: Simulation or World ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
        - description: Stable key for this request. Reuse with the same target returns the same operation.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 256
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceTimeInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockAdvance"
          description: Accepted
        "400":
          content:
            application/problem+json:
              examples:
                bad_request_body:
                  $ref: "#/components/examples/bad_request_body"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/problem+json:
              examples:
                auth_forbidden_simulation:
                  $ref: "#/components/examples/auth_forbidden_simulation"
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              examples:
                simulation_not_found:
                  $ref: "#/components/examples/simulation_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          content:
            application/problem+json:
              examples:
                clock_conflict:
                  $ref: "#/components/examples/clock_conflict"
                simulation_platform_owned:
                  $ref: "#/components/examples/simulation_platform_owned"
                simulation_stopped:
                  $ref: "#/components/examples/simulation_stopped"
                simulation_world_owned:
                  $ref: "#/components/examples/simulation_world_owned"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          content:
            application/problem+json:
              examples:
                validation_clock_time:
                  $ref: "#/components/examples/validation_clock_time"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Advance Simulation Time
      tags:
        - simulations
  /v1/simulations/{id}/advances/{advance_id}:
    get:
      description: Returns durable clock progress, the event count, and the committed step or failure.
      operationId: get-simulation-advance
      parameters:
        - description: Simulation or World ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
        - description: Clock advance operation ID.
          in: path
          name: advance_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockAdvance"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/problem+json:
              examples:
                auth_forbidden_simulation:
                  $ref: "#/components/examples/auth_forbidden_simulation"
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              examples:
                clock_advance_not_found:
                  $ref: "#/components/examples/clock_advance_not_found"
                simulation_not_found:
                  $ref: "#/components/examples/simulation_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/problem+json:
              examples:
                simulation_stopped:
                  $ref: "#/components/examples/simulation_stopped"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Get Simulation Clock Advance
      tags:
        - simulations
  /v1/simulations/{id}/advances/{advance_id}/events:
    get:
      description: Returns the ordered event trace for a committed advance. The Simulation must be running or paused. Forks retain traces in their inherited state.
      operationId: list-simulation-advance-events
      parameters:
        - description: Simulation ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^sim_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
        - description: Advance ID. A historical fork can read inherited runtime receipts.
          in: path
          name: advance_id
          required: true
          schema:
            type: string
        - description: Cursor from the previous page.
          explode: false
          in: query
          name: cursor
          schema:
            type: string
        - description: Page size, up to 200.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
