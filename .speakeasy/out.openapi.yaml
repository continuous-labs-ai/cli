      description: Cancels an active World build. Repeated cancellation returns the current World.
      operationId: cancel-world-build
      parameters:
        - description: World ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^wld_[0-9A-HJKMNP-TV-Z]{26}$
