servers:
  - description: Continuous production API.
    url: https://api.continuouslabs.ai
tags:
  - description: Build Simulators from OpenAPI or WSDL documents, check or cancel a build, and delete Simulators.
    name: simulators
    x-group: Simulators
  - description: Create Simulations from ready Simulators, then fork, stop, start, and delete them.
    name: simulations
    x-group: Simulations
  - description: Build Worlds from one or more Simulators and start or stop their Simulations together.
    name: worlds
    x-group: Worlds
