          type: string
        status_changed_at:
          description: When the Box entered its current status, such as how long it has been starting.
          format: date-time
          type: string
        url:
          description: URL that opens the Web Box's app, at a host of its own.
          format: uri
          type: string
      required:
        - id
        - name
        - snapshot_id
        - status
        - url
        - apibox_id
        - error
        - metadata
        - include_sample_data
        - created_at
        - last_active_at
        - status_changed_at
        - deleted_at
      type: object
    WebBoxConnection:
      additionalProperties: false
      properties:
        url:
          description: URL that opens the Web Box's app.
          format: uri
          type: string
      required:
        - url
      type: object
    WebBoxSnapshot:
      additionalProperties: false
      properties:
        actors:
          description: The callers a request to a Box started from the Snapshot can act as by sending an actor's id in the X-Continuous-Actor header. Without the header, a request acts as the default actor. An MCP Box Snapshot lists its API Box Snapshot's actors. A Web Box Snapshot lists its one actor, the account every page is served as, which no header selects. Empty before the Snapshot is ready, when its build names none, or in a list until the Snapshot's actors are first read.
          items:
            $ref: "#/components/schemas/Actor"
          type: array
        apibox_snapshot_id:
          description: The API Box Snapshot it was built on, whose API it also serves; empty for a Snapshot built on none. A Web Box created from it fronts a new API Box and shares that API Box's state.
          pattern: ^(abs_[0-9A-HJKMNP-TV-Z]{26})?$
          type: string
        build:
          description: The build's latest progress report, or null before the first report. A settled Snapshot keeps its last report. A waiting build resumes when the Snapshot's resume is requested.
          oneOf:
            - $ref: "#/components/schemas/BuildProgress"
            - type: "null"
        composition:
          description: What a ready Snapshot serves, or null.
          oneOf:
            - $ref: "#/components/schemas/SnapshotComposition"
            - type: "null"
        created_at:
          description: Snapshot creation time.
          format: date-time
          type: string
        credential_ids:
          description: Workspace credentials the build used, such as a web app login or credentials it was allowed to call real systems with. Empty when none.
          items:
            pattern: ^crd_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          type: array
        error:
          $ref: "#/components/schemas/BuildError"
          description: Why the build failed or was canceled, or null.
        hidden_limitations:
          description: Limitations the Snapshot records beyond those listed in limitations.
          format: int64
          minimum: 0
          type: integer
        id:
          description: Web Box Snapshot ID.
          pattern: ^wbs_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        instructions:
          description: The instructions the build followed, or empty when none were given.
          type: string
        limitations:
          description: Behavior the Snapshot does not serve like the real system, most important first. Empty when none.
          items:
            $ref: "#/components/schemas/Limitation"
          type: array
        metadata:
          description: Customer JSON metadata, or null.
        name:
          description: Snapshot name. The ID is its identity, and names need not be unique.
          maxLength: 128
          type: string
        parent_id:
          description: The Snapshot an incremental build started from, or null for any other Snapshot or once that Snapshot is deleted.
          pattern: ^wbs_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        research:
          description: The build's research stage, or null when research did not run.
          oneOf:
            - $ref: "#/components/schemas/BuildResearch"
            - type: "null"
        source:
          description: catalog for a Snapshot Continuous publishes, build for one built into the workspace, box for one saved from a Web Box.
          enum:
            - catalog
            - build
            - box
          type: string
        source_box_id:
          description: The box the Snapshot was saved from, or null for a Snapshot not saved from a box.
          pattern: ^wbx_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        source_snapshot_id:
          description: The Snapshot the box it was saved from started from, or null for a Snapshot not saved from a box, or once that Snapshot is deleted.
          pattern: ^wbs_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        status:
          description: pending while waiting for capacity; building while the build runs; ready when boxes can start from it; failed when the build failed; canceled when a cancel request took effect.
          enum:
            - pending
            - building
            - ready
            - failed
            - canceled
          type: string
      required:
        - id
        - source
        - apibox_snapshot_id
        - name
        - status
        - instructions
        - credential_ids
        - error
        - build
        - research
        - limitations
        - hidden_limitations
        - composition
        - actors
        - metadata
        - parent_id
        - source_box_id
        - source_snapshot_id
        - created_at
      type: object
  securitySchemes:
    apiKeyAuth:
      bearerFormat: Continuous API key
      description: Use a Continuous API key. Send it in the Authorization header as a Bearer token.
      scheme: bearer
      type: http
info:
  description: Start API Boxes, Web Boxes and MCP Boxes from Snapshots. Authenticate every request with an API key sent as a Bearer token.
  title: Continuous API
  version: v1
openapi: 3.1.0
paths:
  /v1/apibox:
    get:
      description: Returns the workspace's API Boxes, newest first. Results can be filtered by status and Snapshot. With deleted=true, it returns the API Boxes deleted in the last 14 days instead.
      operationId: list-apiboxes
      parameters:
        - description: Only API Boxes with this status.
          explode: false
          in: query
          name: status
          schema:
            enum:
              - starting
              - running
              - stopping
              - stopped
            type: string
        - description: Only API Boxes started from this Snapshot.
          explode: false
          in: query
          name: snapshot_id
          schema:
            pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
        - description: Page size. Values below 1 use 50. Values above 200 use 200.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            type: integer
        - description: Opaque next_cursor value from a previous page.
          explode: false
          in: query
          name: cursor
          schema:
            type: string
        - description: List only the API Boxes deleted in the last 14 days, each with when it was deleted, in place of those not deleted.
          explode: false
          in: query
          name: deleted
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIBoxesResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                bad_request:
                  $ref: "#/components/examples/bad_request"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          content:
            application/problem+json:
              examples:
                validation_list_limit:
                  $ref: "#/components/examples/validation_list_limit"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: List API Boxes
      tags:
        - apiboxes
      x-speakeasy-name-override: list
      x-speakeasy-pagination:
        inputs:
          - in: parameters
            name: cursor
            type: cursor
        outputs:
          nextCursor: $.next_cursor
        type: cursor
      x-speakeasy-retries:
        backoff:
          exponent: 1.5
          initialInterval: 500
          maxElapsedTime: 60000
          maxInterval: 5000
        retryConnectionErrors: true
        statusCodes:
          - "502"
          - "503"
          - "504"
        strategy: backoff
    post:
      description: Creates an API Box from a ready API Box Snapshot and starts it. It returns at once with status starting and the API Box's token; get the API Box until it is running. Send the token in X-Continuous-Token on each request to the API Box's endpoint. The token lasts as long as the API Box, and its get returns it again. Each API Box has its own state, and runs in real time.
      operationId: create-apibox
      parameters:
        - description: Optional key for retrying this create safely. A retry with the same key and request returns the same API Box and token. The same key with a different request returns 409 idempotency_conflict.
          in: header
          name: Idempotency-Key
          schema:
            maxLength: 256
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIBoxRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIBoxResponse"
          description: Accepted
        "400":
          content:
            application/problem+json:
              examples:
                bad_request_body:
                  $ref: "#/components/examples/bad_request_body"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_not_found:
                  $ref: "#/components/examples/apibox_snapshot_not_found"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Not Found
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_not_ready:
                  $ref: "#/components/examples/apibox_snapshot_not_ready"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Conflict
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          content:
            application/problem+json:
              examples:
                validation_metadata:
                  $ref: "#/components/examples/validation_metadata"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              examples:
                box_quota_exceeded:
                  $ref: "#/components/examples/box_quota_exceeded"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Too Many Requests
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Create API Box
      tags:
        - apiboxes
      x-speakeasy-name-override: create
  /v1/apibox-snapshots:
    get:
      description: Returns the workspace's API Box Snapshots and the catalog's, newest first. Results can be filtered by source and status, and by the API Box a Snapshot was saved from.
      operationId: list-apibox-snapshots
      parameters:
        - description: Optional build status filter.
          explode: false
          in: query
          name: status
          schema:
            enum:
              - pending
              - building
              - ready
              - failed
              - canceled
            type: string
        - description: Page size. Values below 1 use 50. Values above 200 use 200.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            type: integer
        - description: Opaque next_cursor value from a previous page.
          explode: false
          in: query
          name: cursor
          schema:
            type: string
        - description: Optional source filter.
          explode: false
          in: query
          name: source
          schema:
            enum:
              - catalog
              - build
              - box
            type: string
        - description: Optional filter for the Snapshots saved from this Box.
          explode: false
          in: query
          name: source_box_id
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIBoxSnapshotsResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                bad_request:
                  $ref: "#/components/examples/bad_request"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          content:
            application/problem+json:
              examples:
                validation_list_limit:
                  $ref: "#/components/examples/validation_list_limit"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: List API Box Snapshots
      tags:
        - apibox-snapshots
      x-speakeasy-name-override: list
      x-speakeasy-pagination:
        inputs:
          - in: parameters
            name: cursor
            type: cursor
        outputs:
          nextCursor: $.next_cursor
        type: cursor
      x-speakeasy-retries:
        backoff:
          exponent: 1.5
          initialInterval: 500
          maxElapsedTime: 60000
          maxInterval: 5000
        retryConnectionErrors: true
        statusCodes:
          - "502"
          - "503"
          - "504"
        strategy: backoff
    post:
      description: "Starts an asynchronous build and returns the API Box Snapshot with status pending. Get the Snapshot until its status is ready, failed or canceled; API Boxes start from a ready one. The build runs in real time: the built service has no simulated clock, and its scheduled work runs at the first request at or after its time. Builds of every kind share one queue and the daily quota. Send multipart/form-data with a JSON part named request, a file part named spec with the OpenAPI, WSDL or GraphQL document, and optional file parts named document with vendor documentation. To build on a ready Snapshot, set parent_id; the spec part is then optional."
      operationId: create-apibox-snapshot
      parameters:
        - description: Optional key for retrying this create safely. A retry with the same key and request returns the original result with its status; the same key with a different request returns 409 idempotency_conflict. Without a key, each request creates a new resource. The key is recorded before the build starts, so a retry never starts a second build.
          in: header
          name: Idempotency-Key
          schema:
            maxLength: 256
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              document:
                contentType: application/octet-stream
              request:
                contentType: application/json
              spec:
                contentType: application/octet-stream
            schema:
              additionalProperties: false
              properties:
                document:
                  description: "Vendor documentation the builder and reviewer read before they start, as repeated file parts: UTF-8 text (.md, .txt, .html, .json, .yaml, .xml, .csv) or PDF (.pdf). The documents share the request body limit with the spec."
                  items:
                    contentEncoding: binary
                    contentMediaType: application/octet-stream
                    format: binary
                    type: string
                  type: array
                request:
                  $ref: "#/components/schemas/BuildAPIBoxSnapshotRequest"
                  description: Build options as JSON.
                spec:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  description: OpenAPI, WSDL or GraphQL document, UTF-8 encoded, at most 64 MiB.
                  format: binary
                  type: string
              required:
                - request
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIBoxSnapshot"
          description: Accepted
        "400":
          content:
            application/problem+json:
              examples:
                bad_request_body:
                  $ref: "#/components/examples/bad_request_body"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_not_found_parent:
                  $ref: "#/components/examples/apibox_snapshot_not_found_parent"
                credential_not_found_build:
                  $ref: "#/components/examples/credential_not_found_build"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Not Found
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_not_ready_parent:
                  $ref: "#/components/examples/apibox_snapshot_not_ready_parent"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Conflict
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          content:
            application/problem+json:
              examples:
                build_rate_exceeded:
                  $ref: "#/components/examples/build_rate_exceeded"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds until the daily UTC build allowance resets.
              schema:
                minimum: 1
                type: integer
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Service Unavailable
          headers:
            Retry-After:
              description: Seconds to wait before retrying a build after a storage failure or operation timeout. Other service and authentication failures can omit this header.
              schema:
                minimum: 1
                type: integer
      security:
        - apiKeyAuth: []
      summary: Create API Box Snapshot
      tags:
        - apibox-snapshots
      x-speakeasy-name-override: create
  /v1/apibox-snapshots/{id}:
    delete:
      description: Deletes an API Box Snapshot. A build that is still pending or building is canceled first. A Snapshot that API Boxes started from, or that MCP Box Snapshots or Web Box Snapshots name, returns 409 apibox_snapshot_in_use; delete those first. While a build that names it as parent_id is pending or building, it returns 409 apibox_snapshot_parent_in_use; retry after the build finishes. Catalog Snapshots cannot be deleted.
      operationId: delete-apibox-snapshot
      parameters:
        - description: API Box Snapshot ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/problem+json:
              examples:
                auth_forbidden_catalog_apibox:
                  $ref: "#/components/examples/auth_forbidden_catalog_apibox"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_not_found:
                  $ref: "#/components/examples/apibox_snapshot_not_found"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Not Found
        "409":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_in_use:
                  $ref: "#/components/examples/apibox_snapshot_in_use"
                apibox_snapshot_parent_in_use:
                  $ref: "#/components/examples/apibox_snapshot_parent_in_use"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Conflict
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Delete API Box Snapshot
      tags:
        - apibox-snapshots
      x-speakeasy-name-override: delete
    get:
      description: Returns an API Box Snapshot of the workspace or the catalog, and its build status.
      operationId: get-apibox-snapshot
      parameters:
        - description: API Box Snapshot ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIBoxSnapshot"
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_not_found:
                  $ref: "#/components/examples/apibox_snapshot_not_found"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Not Found
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Get API Box Snapshot
      tags:
        - apibox-snapshots
      x-speakeasy-name-override: get
      x-speakeasy-retries:
        backoff:
          exponent: 1.5
          initialInterval: 500
          maxElapsedTime: 60000
          maxInterval: 5000
        retryConnectionErrors: true
        statusCodes:
          - "502"
          - "503"
          - "504"
        strategy: backoff
    patch:
      description: Renames an API Box Snapshot or replaces its metadata. Omitted fields keep their current values. The built service does not change. Catalog Snapshots cannot be updated.
      operationId: update-apibox-snapshot
      parameters:
        - description: API Box Snapshot ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAPIBoxSnapshotRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIBoxSnapshot"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                bad_request_body:
                  $ref: "#/components/examples/bad_request_body"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          content:
            application/problem+json:
              examples:
                auth_forbidden_catalog_apibox:
                  $ref: "#/components/examples/auth_forbidden_catalog_apibox"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              examples:
                apibox_snapshot_not_found:
                  $ref: "#/components/examples/apibox_snapshot_not_found"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Not Found
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          content:
            application/problem+json:
              examples:
                validation_metadata:
                  $ref: "#/components/examples/validation_metadata"
                validation_name:
                  $ref: "#/components/examples/validation_name"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/APIError"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
