        apibox_snapshot_id:
          description: The ready API Box Snapshot of the workspace or the catalog whose API the MCP Box calls. Its spec is the build's, and must be OpenAPI or GraphQL. Required without parent_id; with it, omission takes the parent's.
          maxLength: 30
          pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
