                $ref: "#/components/schemas/Error"
          description: Not Found
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - apiKeyAuth: []
      summary: Get World
      tags:
        - worlds
  /v1/worlds/{id}/cancel:
