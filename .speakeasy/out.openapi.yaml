        name:
          description: Name for the Snapshot. Omission generates a name. Names must not contain U+0000. The ID stays its identity, and names need not be unique.
          maxLength: 128
          type: string
        parent_id:
          description: "A ready MCP Box Snapshot of the workspace or the catalog to build on. The build starts from its handlers, tests and documents; its capture and research run as a new build's, with the parent's folder for reference. What the request does not set comes from the parent: its API Box Snapshot, its documents, which an upload of the same name replaces, its model, its review rounds, and its credential if the workspace still has it. timeout_seconds keeps its default."
          maxLength: 30
          pattern: ^mbs_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        review_rounds:
          description: Review rounds, from 1 to 10. Omission means 1 without parent_id and the parent's review rounds with it. Each round is a review and a repair of its findings, by the same builder and reviewer. The rounds stop early when the reviewer reports no findings.
          format: int64
          maximum: 10
          minimum: 1
          type: integer
        timeout_seconds:
          default: 43200
          description: Time limit for generation and validation in seconds, from 1 to 172800. Defaults to 43200 (twelve hours). Excludes queue wait, finalization, and any wait for the requester. Retries share the same deadline.
          format: int64
          maximum: 172800
          minimum: 1
          type: integer
      type: object
    BuildProgress:
      additionalProperties: false
      properties:
        agent_state:
          description: "What the build's agent was doing when the build last checked on it, every few minutes. The values are informational and can change. Today's values: working while it thinks or runs a command, idle when its turn ended without a tool call, waiting_for_limit while the agent waits for its usage limit to reset. Null when the build is not running or while it waits for the requester."
          type:
            - string
            - "null"
        hidden_limitations:
          description: Limitations the accepted build records beyond those listed in limitations.
          format: int64
          minimum: 0
          type: integer
        last_activity_at:
          description: When the build last saw its agent act, with or without a tool call. Null when agent_state is null or no activity was seen.
          format: date-time
          type:
            - string
            - "null"
        last_submission:
          description: "Outcome of the most recent submit attempt, or null. The values are informational and can change. Today's values: accepted, rejected."
          type:
            - string
            - "null"
        last_tool:
          description: Name of the most recent tool call, or null. Tool arguments and output are private.
          type:
            - string
            - "null"
        limitations:
          description: Behavior the accepted build does not serve like the real system, most important first, set when the build is accepted. Empty when none.
          items:
            $ref: "#/components/schemas/Limitation"
          maxItems: 50
          type: array
        model:
          description: The model the builder and reviewer run on, or combined, which currently runs as claude-opus-5-5.
          enum:
            - gpt-6-astra
            - gpt-6.1-sol
            - claude-opus-5-5
            - claude-fable-5-2
            - combined
          type: string
        phase:
          description: "Agent phase. The values are informational and can change. Today's values: research while the research agent indexes the documents and saves the vendor pages they lack; build for generation, review for the separate reviewer, qa while QA tests the running service from outside, after the last review round of a build with credential_ids, repair while the author fixes the findings of a review or QA. Null when not recorded."
          type:
            - string
            - "null"
        review_round:
          description: Review round that phase review, qa, or repair belongs to, from 1. In a build with credential_ids, QA and the repair after it are in round review_rounds + 1. 0 before the first review.
          format: int64
          maximum: 11
          minimum: 0
          type: integer
        review_rounds:
          description: Review rounds the build runs at most. Fewer run when the reviewer agrees early.
          format: int64
          maximum: 10
          minimum: 1
          type: integer
        stage:
          description: "Build stage. The values are informational and can change. Today's values: derive while the effective spec, build skeleton, and sandbox are prepared; build while the coding loop runs; assemble while an accepted artifact publishes."
          type: string
        submissions:
          description: Submit attempts.
          format: int64
          minimum: 0
          type: integer
        tool_calls:
          description: Tool calls the coding loop executed.
          format: int64
          minimum: 0
          type: integer
        waited_seconds:
          description: Total seconds of the build's ended waits, which do not count toward its time limit. 0 when none has ended. The current wait, from waiting.since, is not included.
          format: int64
          minimum: 0
          type: integer
        waiting:
          description: "Set while the build waits for the requester: because the live system rejected its credentials, rate limited its calls or could not be reached, because its model or sandbox provider was unavailable, or for more time after it used its time limit. Resume it with its resource's resume operation, such as POST /v1/apibox-snapshots/{id}/resume. Null otherwise."
          oneOf:
            - $ref: "#/components/schemas/BuildWaiting"
            - type: "null"
        waiting_until:
          description: When the usage limit resets while agent_state is waiting_for_limit. The agent continues then, and the wait does not use the build's time limit. Null otherwise.
          format: date-time
          type:
            - string
            - "null"
        warnings:
          description: Specification defects the build tolerated without changing the specification, set when the build prepares its specification. Empty when none.
          items:
            $ref: "#/components/schemas/SpecificationWarning"
          maxItems: 20
          type: array
      required:
        - model
        - phase
        - review_round
        - review_rounds
        - stage
        - tool_calls
        - submissions
        - last_tool
        - last_submission
        - warnings
        - limitations
        - hidden_limitations
        - waited_seconds
        - waiting
        - agent_state
        - last_activity_at
        - waiting_until
      type: object
    BuildResearch:
      additionalProperties: false
      properties:
        bytes:
          description: Total size of the saved pages in bytes.
          format: int64
          minimum: 0
          type: integer
        pages:
          description: Vendor pages research saved for the build.
          format: int64
          minimum: 0
          type: integer
        status:
          description: pending until the stage starts; running while the research agent indexes the documents and saves the vendor pages they lack; complete when it wrote an index that names every document; failed when it could not finish, which fails the build, or when the build ended first; provided when research did not run because the build already had an index.
          enum:
            - pending
            - running
            - complete
            - failed
            - provided
