  securitySchemes:
    apiKeyAuth:
      bearerFormat: Continuous API key
      description: Use a Continuous API key. Send it in the Authorization header as a Bearer token.
      scheme: bearer
      type: http
info:
  description: Start API Boxes, Web Boxes and MCP Boxes from Snapshots. Authenticate every request with an API key sent as a Bearer token.
  title: Continuous API
  version: v1
openapi: 3.1.0
paths:
  /v1/apibox:
    get:
      description: Returns the workspace's API Boxes, newest first. Results can be filtered by status and Snapshot.
      operationId: list-apiboxes
      parameters:
        - description: Only API Boxes with this status.
          explode: false
          in: query
          name: status
          schema:
            enum:
              - starting
              - running
              - stopping
              - stopped
            type: string
        - description: Only API Boxes started from this Snapshot.
          explode: false
          in: query
          name: snapshot_id
          schema:
            pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
        - description: Page size. Values below 1 use 50. Values above 200 use 200.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            type: integer
        - description: Opaque next_cursor value from a previous page.
          explode: false
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIBoxesResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                bad_request:
                  $ref: "#/components/examples/bad_request"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          content:
            application/problem+json:
              examples:
                validation_list_limit:
                  $ref: "#/components/examples/validation_list_limit"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: List API Boxes
      tags:
        - apibox
      x-speakeasy-pagination:
        inputs:
          - in: parameters
            name: cursor
            type: cursor
        outputs:
          nextCursor: $.next_cursor
        type: cursor
      x-speakeasy-retries:
        backoff:
          exponent: 1.5
