components:
  examples:
    apibox_in_use:
      value:
        code: apibox_in_use
        detail: MCP Boxes or a Web Box front the API Box with ID "abx_01J8Z5X4K70000000000000001". Delete them before you delete it.
        validation: null
    apibox_not_found:
      value:
        code: apibox_not_found
        detail: No API Box was found with ID "abx_01J8Z5X4K70000000000000001".
        validation: null
    apibox_not_stopped:
      value:
        code: apibox_not_stopped
        detail: The API Box with ID "abx_01J8Z5X4K70000000000000001" is not stopped. Stop it before you start it.
        validation: null
    apibox_rebuild_required:
      value:
        code: apibox_rebuild_required
        detail: The runtime of the API Box with ID "abx_01J8Z5X4K70000000000000001" cannot save its state. Rebuild its Snapshot, then save a Box created from the new one.
        validation: null
    apibox_snapshot_in_use:
      value:
        code: apibox_snapshot_in_use
        detail: Boxes or Snapshots use the API Box Snapshot with ID "abs_01J8Z5X4K70000000000000002". Delete them before you delete it.
        validation: null
    apibox_snapshot_not_found:
      value:
        code: apibox_snapshot_not_found
        detail: No API Box Snapshot was found with ID "abs_01J8Z5X4K70000000000000002".
        validation: null
    apibox_snapshot_not_found_parent:
      value:
        code: apibox_snapshot_not_found
        detail: No API Box Snapshot of the workspace or the catalog has the parent_id "abs_01J8Z5X4K70000000000000002".
        validation: null
    apibox_snapshot_not_ready:
      value:
        code: apibox_snapshot_not_ready
        detail: The API Box Snapshot with ID "abs_01J8Z5X4K70000000000000002" is building; API Boxes start only from a ready one.
        validation: null
    apibox_snapshot_not_ready_parent:
      value:
        code: apibox_snapshot_not_ready
        detail: The parent API Box Snapshot with ID "abs_01J8Z5X4K70000000000000002" is building. Build on a ready one.
        validation: null
    apibox_snapshot_not_waiting:
      value:
        code: apibox_snapshot_not_waiting
        detail: The build of the API Box Snapshot with ID "abs_01J8Z5X4K70000000000000002" is not waiting.
        validation: null
    apibox_snapshot_parent_in_use:
      value:
        code: apibox_snapshot_parent_in_use
        detail: A build that starts from the API Box Snapshot with ID "abs_01J8Z5X4K70000000000000002" is pending or building. Retry after it finishes, or cancel it.
        validation: null
    apibox_starting:
      value:
        code: apibox_starting
        detail: The API Box with ID "abx_01J8Z5X4K70000000000000001" is starting. Retry once it is running.
        validation: null
    apibox_stopped:
      value:
        code: apibox_stopped
        detail: The API Box with ID "abx_01J8Z5X4K70000000000000001" is not running. Start it before you retry this request.
        validation: null
    auth_forbidden_catalog_apibox:
      value:
        code: auth_forbidden
        detail: The API Box Snapshot with ID "abs_01J8Z5X4K70000000000000002" belongs to the Continuous catalog and cannot be changed.
        validation: null
    auth_forbidden_catalog_mcpbox:
      value:
        code: auth_forbidden
        detail: The MCP Box Snapshot with ID "mbs_01J8Z5X4K70000000000000007" belongs to the Continuous catalog and cannot be changed.
        validation: null
    auth_forbidden_catalog_webbox:
      value:
        code: auth_forbidden
        detail: The Web Box Snapshot with ID "wbs_01J8Z5X4K70000000000000005" belongs to the Continuous catalog and cannot be changed.
        validation: null
    auth_forbidden_clone:
      value:
        code: auth_forbidden
        detail: the API key's organization does not own workspace ws_target
        validation: null
    auth_forbidden_credential:
      value:
        code: auth_forbidden
        detail: The credential with ID "crd_01J8Z5X4K7M2N9P0Q1R2S3T4VA" belongs to another workspace.
        validation: null
    auth_invalid:
      value:
        code: auth_invalid
        detail: The authentication credential is invalid.
        validation: null
    auth_invalid_missing:
      value:
        code: auth_invalid
        detail: Authentication credentials are required.
        validation: null
    auth_provider_unavailable:
      value:
        code: auth_provider_unavailable
        detail: The authentication provider is unavailable. Retry the request after a short delay.
        validation: null
    bad_request:
      value:
        code: bad_request
        detail: The cursor is invalid.
        validation: null
    bad_request_add_seconds:
      value:
        code: bad_request
        detail: add_seconds must be an integer from 1 to 172800.
        validation: null
    bad_request_body:
      value:
        code: bad_request
        detail: request body is invalid
        validation: null
    bad_request_clone_target:
      value:
        code: bad_request
        detail: target_workspace_id must differ from the source workspace
        validation: null
    box_quota_exceeded:
      value:
        code: box_quota_exceeded
        detail: The workspace has 5 running Boxes, and its limit is 5. Stop or delete one, then retry.
        validation: null
    build_rate_exceeded:
      value:
        code: build_rate_exceeded
        detail: The workspace has used 10 of its limit of 10 builds for the current UTC day. The limit resets at the next UTC midnight.
        validation: null
    credential_not_found:
      value:
        code: credential_not_found
        detail: No credential was found with ID "crd_01J8Z5X4K7M2N9P0Q1R2S3T4VA".
        validation: null
    credential_not_found_build:
      value:
        code: credential_not_found
        detail: No credential of the workspace was found with ID "crd_01J8Z5X4K7M2N9P0Q1R2S3T4VA" in credential_ids.
        validation: null
    idempotency_conflict:
      value:
        code: idempotency_conflict
        detail: The Idempotency-Key was already used with a different request. Use a new Idempotency-Key.
        validation: null
    internal:
      value:
        code: internal
        detail: The server encountered an unexpected error.
        validation: null
    internal_unavailable:
      value:
        code: internal_unavailable
        detail: The service is temporarily unavailable. Retry the request after a short delay.
        validation: null
    mcpbox_apibox_gone:
      value:
        code: mcpbox_apibox_gone
        detail: The API Box with ID "abx_01J8Z5X4K70000000000000001" that the MCP Box with ID "mbx_01J8Z5X4K70000000000000006" fronts was deleted. Create a new MCP Box in front of another API Box.
        validation: null
    mcpbox_not_found:
      value:
        code: mcpbox_not_found
        detail: No MCP Box was found with ID "mbx_01J8Z5X4K70000000000000006".
        validation: null
    mcpbox_not_stopped:
      value:
        code: mcpbox_not_stopped
        detail: The MCP Box with ID "mbx_01J8Z5X4K70000000000000006" is not stopped. Stop it before you start it.
        validation: null
    mcpbox_rebuild_required:
      value:
        code: mcpbox_rebuild_required
        detail: The runtime of the API Box with ID "abx_01J8Z5X4K70000000000000001" that the MCP Box with ID "mbx_01J8Z5X4K70000000000000006" fronts cannot save its state. Rebuild its API Box Snapshot and an MCP Box Snapshot against the new one, then save an MCP Box created from them.
        validation: null
    mcpbox_snapshot_in_use:
      value:
        code: mcpbox_snapshot_in_use
        detail: Boxes or Snapshots use the MCP Box Snapshot with ID "mbs_01J8Z5X4K70000000000000007". Delete them before you delete it.
        validation: null
    mcpbox_snapshot_not_found:
      value:
        code: mcpbox_snapshot_not_found
        detail: No MCP Box Snapshot was found with ID "mbs_01J8Z5X4K70000000000000007".
        validation: null
    mcpbox_snapshot_not_found_parent:
      value:
        code: mcpbox_snapshot_not_found
        detail: No MCP Box Snapshot of the workspace or the catalog has the parent_id "mbs_01J8Z5X4K70000000000000007".
        validation: null
    mcpbox_snapshot_not_ready:
      value:
        code: mcpbox_snapshot_not_ready
        detail: The MCP Box Snapshot with ID "mbs_01J8Z5X4K70000000000000007" is building; MCP Boxes start only from a ready one.
        validation: null
    mcpbox_snapshot_not_ready_parent:
      value:
        code: mcpbox_snapshot_not_ready
        detail: The parent MCP Box Snapshot with ID "mbs_01J8Z5X4K70000000000000007" is building. Build on a ready one.
        validation: null
    mcpbox_snapshot_not_waiting:
      value:
        code: mcpbox_snapshot_not_waiting
        detail: The build of the MCP Box Snapshot with ID "mbs_01J8Z5X4K70000000000000007" is not waiting.
        validation: null
    mcpbox_snapshot_parent_in_use:
      value:
        code: mcpbox_snapshot_parent_in_use
        detail: A build that starts from the MCP Box Snapshot with ID "mbs_01J8Z5X4K70000000000000007" is pending or building. Retry after it finishes, or cancel it.
        validation: null
    mcpbox_starting:
      value:
        code: mcpbox_starting
        detail: The MCP Box with ID "mbx_01J8Z5X4K70000000000000006" is starting. Retry once it is running.
        validation: null
    payload_too_large:
      value:
        code: payload_too_large
        detail: The request body exceeds the maximum allowed size.
        validation: null
    request_timeout:
      value:
        code: request_timeout
        detail: The request body was not received before the timeout. Retry the request.
        validation: null
    unsupported_media_type:
      value:
        code: unsupported_media_type
        detail: The request Content-Type is not supported.
        validation: null
    validation_apibox_mismatch:
      value:
        code: validation
        detail: The API Box with ID "abx_01J8Z5X4K70000000000000001" started from API Box Snapshot "abs_01J8Z5X4K70000000000000002", but the MCP Box Snapshot was built against "abs_01J8Z5X4K70000000000000003".
        validation: null
    validation_credential:
      value:
        code: validation
        detail: base_url must be an https URL with a literal host name or IP address and no user information
        validation: null
    validation_credential_value:
      value:
        code: validation
        detail: value or oauth is required when base_url or header changes
        validation: null
    validation_idempotency_key:
      value:
        code: validation
        detail: Idempotency-Key must contain between 1 and 256 bytes
        validation: null
    validation_list_limit:
      value:
        code: validation
        detail: "validation failed: invalid integer at query.limit"
        validation: null
    validation_metadata:
      value:
        code: validation
        detail: metadata exceeds 16 KiB
        validation: null
    validation_name:
      value:
        code: validation
        detail: name must not be blank
        validation: null
    webbox_not_found:
      value:
        code: webbox_not_found
        detail: No Web Box was found with ID "wbx_01J8Z5X4K70000000000000004".
        validation: null
    webbox_not_stopped:
      value:
        code: webbox_not_stopped
        detail: The Web Box with ID "wbx_01J8Z5X4K70000000000000004" is not stopped. Stop it before you start it.
        validation: null
    webbox_rebuild_required:
      value:
        code: webbox_rebuild_required
        detail: The runtime of the Web Box with ID "wbx_01J8Z5X4K70000000000000004" cannot save its state. Rebuild its Snapshot, then save a Box created from the new one.
        validation: null
    webbox_snapshot_in_use:
      value:
        code: webbox_snapshot_in_use
        detail: Boxes or Snapshots use the Web Box Snapshot with ID "wbs_01J8Z5X4K70000000000000005". Delete them before you delete it.
        validation: null
    webbox_snapshot_not_found:
      value:
        code: webbox_snapshot_not_found
        detail: No Web Box Snapshot was found with ID "wbs_01J8Z5X4K70000000000000005".
        validation: null
    webbox_snapshot_not_found_parent:
      value:
        code: webbox_snapshot_not_found
        detail: No Web Box Snapshot of the workspace or the catalog has the parent_id "wbs_01J8Z5X4K70000000000000005".
        validation: null
    webbox_snapshot_not_ready:
      value:
        code: webbox_snapshot_not_ready
        detail: The Web Box Snapshot with ID "wbs_01J8Z5X4K70000000000000005" is building; Web Boxes start only from a ready one.
        validation: null
    webbox_snapshot_not_ready_parent:
      value:
        code: webbox_snapshot_not_ready
        detail: The parent Web Box Snapshot with ID "wbs_01J8Z5X4K70000000000000005" is building. Build on a ready one.
        validation: null
    webbox_snapshot_not_waiting:
      value:
        code: webbox_snapshot_not_waiting
        detail: The build of the Web Box Snapshot with ID "wbs_01J8Z5X4K70000000000000005" is not waiting.
        validation: null
    webbox_snapshot_parent_in_use:
      value:
        code: webbox_snapshot_parent_in_use
        detail: A build that starts from the Web Box Snapshot with ID "wbs_01J8Z5X4K70000000000000005" is pending or building. Retry after it finishes, or cancel it.
        validation: null
    webbox_starting:
      value:
        code: webbox_starting
        detail: The Web Box with ID "wbx_01J8Z5X4K70000000000000004" is starting. Retry once it is running.
        validation: null
    webbox_stopped:
      value:
        code: webbox_stopped
        detail: The Web Box with ID "wbx_01J8Z5X4K70000000000000004" is not running. Start it before you retry this request.
        validation: null
    workspace_not_found:
      value:
        code: workspace_not_found
        detail: workspace ws_target not found
        validation: null
  responses:
    InternalServerError:
      content:
        application/problem+json:
          examples:
            internal:
              $ref: "#/components/examples/internal"
          schema:
            $ref: "#/components/schemas/APIError"
      description: Internal Server Error
    PayloadTooLarge:
      content:
        application/problem+json:
          examples:
            payload_too_large:
              $ref: "#/components/examples/payload_too_large"
          schema:
            $ref: "#/components/schemas/APIError"
      description: Request Entity Too Large
    RequestTimeout:
      content:
        application/problem+json:
          examples:
            request_timeout:
              $ref: "#/components/examples/request_timeout"
          schema:
            $ref: "#/components/schemas/APIError"
      description: Request Timeout
    Unauthorized:
      content:
        application/problem+json:
          examples:
            auth_invalid:
              $ref: "#/components/examples/auth_invalid"
            auth_invalid_missing:
              $ref: "#/components/examples/auth_invalid_missing"
          schema:
            $ref: "#/components/schemas/APIError"
      description: Unauthorized
    UnsupportedMediaType:
      content:
        application/problem+json:
          examples:
            unsupported_media_type:
              $ref: "#/components/examples/unsupported_media_type"
          schema:
            $ref: "#/components/schemas/APIError"
      description: Unsupported Media Type
  schemas:
    APIBox:
      additionalProperties: false
      properties:
        created_at:
          description: API Box creation time.
          format: date-time
          type: string
        deleted_at:
          description: When the Box was deleted, in a list of deleted Boxes; null otherwise.
          format: date-time
          type:
            - string
            - "null"
        endpoint:
          description: Base URL of the API Box's API. Send the API Box's token in X-Continuous-Token.
          format: uri
          type: string
        error:
          $ref: "#/components/schemas/BoxError"
          description: Why its last run stopped without a stop request, or null.
        id:
          description: API Box ID.
          pattern: ^abx_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        include_sample_data:
          description: Whether the API Box started with the Snapshot's sample data.
          type: boolean
        last_active_at:
          description: Time of the Box's last data-plane activity.
          format: date-time
          type: string
        metadata:
          description: Customer JSON metadata, or null.
        name:
          description: API Box name. The ID is its identity, and names need not be unique.
          maxLength: 128
          type: string
        snapshot_id:
          description: The API Box Snapshot it started from; empty for a deleted API Box whose Snapshot is deleted too.
          pattern: ^(abs_[0-9A-HJKMNP-TV-Z]{26})?$
          type: string
        status:
          description: starting while its runtime boots; running while it serves requests; stopping while it saves its state; stopped when it holds no runtime. A start resumes the saved state.
          enum:
            - starting
            - running
            - stopping
            - stopped
          type: string
        status_changed_at:
          description: When the Box entered its current status, such as how long it has been starting.
          format: date-time
          type: string
      required:
        - id
        - name
        - snapshot_id
        - status
        - endpoint
        - error
        - metadata
        - include_sample_data
        - created_at
        - last_active_at
        - status_changed_at
        - deleted_at
      type: object
    APIBoxConnection:
      additionalProperties: false
      properties:
        endpoint:
          description: Base URL of the API Box's API.
          format: uri
          type: string
        private_endpoint:
          description: "Base URL of the private API that the web app calls, for an API Box of a pair: one paired with a Web Box, or started from the API Box Snapshot of a pair saved from a Web Box, while that pair's Web Box Snapshot exists. It takes the same token and never reaches an operation of the API. Send the path the web app sends: its own paths as they are, and a call to another host under /_origin/{host}/. Empty for any other API Box."
          type: string
        token:
          description: The API Box's token. Send it in X-Continuous-Token on each request to either endpoint.
          type: string
      required:
        - endpoint
        - private_endpoint
        - token
      type: object
    APIBoxSnapshot:
      additionalProperties: false
      properties:
        actors:
          description: The callers a request to a Box started from the Snapshot can act as by sending an actor's id in the X-Continuous-Actor header. Without the header, a request acts as the default actor. An MCP Box Snapshot lists its API Box Snapshot's actors. A Web Box Snapshot lists its one actor, the account every page is served as, which no header selects. Empty before the Snapshot is ready, when its build names none, or in a list until the Snapshot's actors are first read.
          items:
            $ref: "#/components/schemas/Actor"
          type: array
        build:
          description: The build's latest progress report, or null before the first report. A settled Snapshot keeps its last report. A waiting build resumes when the Snapshot's resume is requested.
          oneOf:
            - $ref: "#/components/schemas/BuildProgress"
            - type: "null"
        composition:
          description: What a ready Snapshot serves, or null.
          oneOf:
            - $ref: "#/components/schemas/SnapshotComposition"
            - type: "null"
        created_at:
          description: Snapshot creation time.
          format: date-time
          type: string
        credential_ids:
          description: Workspace credentials the build used, such as a web app login or credentials it was allowed to call real systems with. Empty when none.
          items:
            pattern: ^crd_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          type: array
        error:
          $ref: "#/components/schemas/BuildError"
          description: Why the build failed or was canceled, or null.
        hidden_limitations:
          description: Limitations the Snapshot records beyond those listed in limitations.
          format: int64
          minimum: 0
          type: integer
        id:
          description: API Box Snapshot ID.
          pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        instructions:
          description: The instructions the build followed, or empty when none were given.
          type: string
        limitations:
          description: Behavior the Snapshot does not serve like the real system, most important first. Empty when none.
          items:
            $ref: "#/components/schemas/Limitation"
          type: array
        metadata:
          description: Customer JSON metadata, or null.
        name:
          description: Snapshot name. The ID is its identity, and names need not be unique.
          maxLength: 128
          type: string
        parent_id:
          description: The Snapshot an incremental build started from, or null for any other Snapshot or once that Snapshot is deleted.
          pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        research:
          description: The build's research stage, or null when research did not run.
          oneOf:
            - $ref: "#/components/schemas/BuildResearch"
            - type: "null"
        source:
          description: catalog for a Snapshot Continuous publishes, build for one built or cloned into the workspace, box for one saved from an API Box.
          enum:
            - catalog
            - build
            - box
          type: string
        source_box_id:
          description: The box the Snapshot was saved from, or null for a Snapshot not saved from a box.
          pattern: ^abx_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        source_snapshot_id:
          description: The Snapshot the box it was saved from started from, or null for a Snapshot not saved from a box, or once that Snapshot is deleted.
          pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        spec_kind:
          description: The specification the Snapshot was built from, or null until the build has read it.
          enum:
            - openapi
            - wsdl
            - graphql
            - null
          type:
            - string
            - "null"
        status:
          description: pending while waiting for capacity; building while the build runs; ready when boxes can start from it; failed when the build failed; canceled when a cancel request took effect.
          enum:
            - pending
            - building
            - ready
            - failed
            - canceled
          type: string
      required:
        - id
        - source
        - spec_kind
        - name
        - status
        - instructions
        - credential_ids
        - error
        - build
        - research
        - limitations
        - hidden_limitations
        - composition
        - actors
        - metadata
        - parent_id
        - source_box_id
        - source_snapshot_id
        - created_at
      type: object
    APIError:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code.
          minLength: 1
          type: string
        detail:
          description: Safe human-readable error detail.
          minLength: 1
          type: string
        validation:
          $ref: "#/components/schemas/SpecificationValidation"
          description: Safe specification diagnostics for a rejected build request, when available.
      required:
        - validation
        - code
        - detail
      type: object
    Actor:
      additionalProperties: false
      properties:
        default:
          description: Whether a request without the header acts as this caller.
          type: boolean
        entity:
          description: The entity whose row the id keys.
          type: string
        id:
          description: "The value to send in the X-Continuous-Actor header: the key of the identity row the caller acts as."
          type: string
        name:
          description: The build's name for the caller.
          type: string
        role:
          description: The caller's role in the simulated service.
          type: string
      required:
        - id
        - name
        - role
        - entity
        - default
      type: object
    BoxError:
      additionalProperties: false
      properties:
        code:
          description: "Stable Box error code: <box>_start_failed when its runtime did not start, <box>_runtime_lost when its runtime was lost, mcpbox_apibox_gone when an MCP Box's API Box was deleted, and mcpbox_apibox_unissued when that API Box has no stored token."
          enum:
            - apibox_start_failed
            - apibox_runtime_lost
            - webbox_start_failed
            - webbox_runtime_lost
            - mcpbox_start_failed
            - mcpbox_runtime_lost
            - mcpbox_apibox_gone
            - mcpbox_apibox_unissued
          type: string
        detail:
          description: Safe human-readable error detail.
          type: string
      required:
        - code
        - detail
      type:
        - object
        - "null"
    BoxStep:
      additionalProperties: false
      properties:
        label:
          description: The request that made the step, or "Handle async events" for events the app scheduled.
          type: string
        step:
          description: Step number, from 1 in order.
          format: int64
          type: integer
        time:
          description: When the request ran, or null when the runtime did not record it.
          format: date-time
          type:
            - string
            - "null"
      required:
        - step
        - label
        - time
      type: object
    BuildAPIBoxSnapshotRequest:
      additionalProperties: false
      properties:
        credential_ids:
          description: Workspace credentials QA and the builder can call real systems with, to compare the build with them. A build with credentials runs QA after its review rounds. At most 5. Each must belong to the workspace and have a base_url. QA may create test objects in the live system and delete them or, where the API cannot, leave them in a final state; otherwise the builder sends only reads. Use a sandbox or test account.
          items:
            maxLength: 30
            pattern: ^crd_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          maxItems: 5
          type: array
        filter:
          description: "Regular expressions (RE2 syntax) that select the operations to implement. Each is matched against the OpenAPI operationId, the WSDL operation ID (the operation name, or <port>.<operation> when two bindings declare the name), or the GraphQL Query or Mutation field name; an operation is kept when any expression matches. An OpenAPI operation without an operationId is given one from its method and path in lower camel case, with each path parameter as By<Name> and a numeric suffix when the ID is taken: GET /v2/accounts/{accountId} becomes getV2AccountsByAccountId. At most 64 expressions of at most 1,024 characters each. Omit or send an empty list to keep every operation of the spec, which for a build on a parent without a spec part is the parent's selection."
          items:
            maxLength: 1024
            type: string
          maxItems: 64
          type: array
        instructions:
          description: Instructions for the builder. At most 16,384 characters and 65,536 UTF-8 bytes; must not be blank or contain U+0000.
          maxLength: 16384
          type: string
        model:
          description: Model that builds and reviews the Snapshot. Omission means combined without parent_id and the parent's model with it. Its provider is derived from the model. combined currently builds, reviews, and runs QA exactly as claude-opus-5-5 does.
          enum:
            - gpt-6-astra
            - gpt-6.1-sol
            - claude-opus-5-5
            - claude-fable-5-2
            - combined
          type: string
        name:
          description: Name for the Snapshot. Omission generates a name. Names must not contain U+0000. The ID stays its identity, and names need not be unique.
          maxLength: 128
          type: string
        parent_id:
          description: "A ready API Box Snapshot of the workspace or the catalog to build on. The build starts from its source, documents and tests. What the request does not set comes from the parent: its spec, its documents, which an upload of the same name replaces, its model, its review rounds, and those of its credentials the workspace still has; timeout_seconds keeps its default. Without a spec part, filter narrows the parent's operations; to widen them, send the full spec."
          maxLength: 30
          pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        review_rounds:
          description: Review rounds, from 1 to 10. Omission means 1 without parent_id and the parent's review rounds with it. Each round is a review and a repair of its findings, by the same builder and reviewer. The rounds stop early when the reviewer reports no findings.
          format: int64
          maximum: 10
          minimum: 1
          type: integer
        spec_kind:
          description: Source specification format. Omission detects the format; GraphQL SDL needs graphql, and a GraphQL introspection result is stored as SDL.
          enum:
            - openapi
            - wsdl
            - graphql
          type: string
        timeout_seconds:
          default: 43200
          description: Time limit for generation and validation in seconds, from 1 to 172800. Defaults to 43200 (twelve hours). Excludes queue wait, finalization, and any wait for the requester. Retries share the same deadline.
          format: int64
          maximum: 172800
          minimum: 1
          type: integer
      type: object
    BuildError:
      additionalProperties: false
      properties:
        agent_message:
          description: Plain-text explanation from the build agent when it could not continue, or the problems the check of the build's index found. At most 4096 UTF-8 bytes.
          maxLength: 4096
          type:
            - string
            - "null"
        code:
          description: Stable build error code. live_credential_rejected is a build that waited for its rejected live credentials and was not resumed within 7 days; live_rate_limited is one that waited for the live system's rate limit and was not resumed within 7 days.
          enum:
            - build_failed
            - build_canceled
            - specification_validation_failed
            - live_credential_rejected
            - live_rate_limited
          type: string
        detail:
          description: Safe human-readable error detail.
          type: string
        reason:
          description: Bounded failure reason for selecting recovery guidance, or null when unavailable.
          enum:
            - canceled
            - specification_invalid
            - time_limit
            - service_unavailable
            - build_failed
            - null
          type:
            - string
            - "null"
        validation:
          $ref: "#/components/schemas/SpecificationValidation"
          description: Specification validation details. Address these issues before building again.
      required:
        - agent_message
        - reason
        - validation
        - code
        - detail
      type:
        - object
        - "null"
    BuildMCPBoxSnapshotRequest:
      additionalProperties: false
