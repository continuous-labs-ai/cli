          maxInterval: 5000
        retryConnectionErrors: true
        statusCodes:
          - "502"
          - "503"
          - "504"
        strategy: backoff
    post:
      description: "Starts an asynchronous build and returns the API Box Snapshot with status pending. Get the Snapshot until its status is ready, failed or canceled; API Boxes start from a ready one. The build is a Simulator build in api mode, run in real time: the built service has no simulated clock, and its scheduled work runs at the first request at or after its time. Builds queue with Simulator builds and count toward the same quotas. Send multipart/form-data with a JSON part named request, a file part named spec with the OpenAPI, WSDL or GraphQL document, and optional file parts named document with vendor documentation."
      operationId: create-apibox-snapshot
      parameters:
        - description: Optional key for retrying this create safely. A retry with the same key and request returns the original result with its status; the same key with a different request returns 409 idempotency_conflict. Without a key, each request creates a new resource. The key is recorded before the build starts, so a retry never starts a second build.
          in: header
          name: Idempotency-Key
          schema:
            maxLength: 256
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              document:
                contentType: application/octet-stream
              request:
                contentType: application/json
              spec:
                contentType: application/octet-stream
            schema:
              additionalProperties: false
              properties:
                document:
                  description: "Vendor documentation the builder and reviewer read before they start, as repeated file parts: UTF-8 text (.md, .txt, .html, .json, .yaml, .xml, .csv) or PDF (.pdf). The documents share the request body limit with the spec."
                  items:
                    contentEncoding: binary
                    contentMediaType: application/octet-stream
                    format: binary
                    type: string
                  type: array
                request:
                  $ref: "#/components/schemas/BuildAPIBoxSnapshotRequest"
                  description: Build options as JSON.
                spec:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  description: OpenAPI, WSDL or GraphQL document, UTF-8 encoded, at most 64 MiB.
                  format: binary
                  type: string
              required:
                - request
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIBoxSnapshot"
          description: Accepted
        "400":
          content:
            application/problem+json:
              examples:
                bad_request_body:
                  $ref: "#/components/examples/bad_request_body"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          content:
            application/problem+json:
              examples:
                validation_build_credential:
                  $ref: "#/components/examples/validation_build_credential"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              examples:
                build_rate_exceeded:
                  $ref: "#/components/examples/build_rate_exceeded"
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds until the daily UTC build allowance resets.
              schema:
                minimum: 1
                type: integer
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
          headers:
            Retry-After:
              description: Seconds to wait before retrying a build after a storage failure or operation timeout. Other service and authentication failures can omit this header.
              schema:
                minimum: 1
                type: integer
