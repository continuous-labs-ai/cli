          - "502"
          - "503"
          - "504"
        strategy: backoff
    post:
      description: "Starts an asynchronous build and returns the Web Box Snapshot with status pending. Get the Snapshot until its status is ready, failed or canceled; Web Boxes start from a ready one. The build is a Web App build, run in real time: the builder and QA use the vendor's live web app through the Web App login credential, and the built app has no simulated clock. Builds queue with Simulator builds and count toward the same quotas. Send multipart/form-data with a JSON part named request and optional file parts named document with vendor documentation."
      operationId: create-webbox-snapshot
      parameters:
        - description: Optional key for retrying this create safely. A retry with the same key and request returns the original result with its status; the same key with a different request returns 409 idempotency_conflict. Without a key, each request creates a new resource. The key is recorded before the build starts, so a retry never starts a second build.
          in: header
          name: Idempotency-Key
          schema:
            maxLength: 256
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              document:
                contentType: application/octet-stream
              request:
                contentType: application/json
            schema:
              additionalProperties: false
              properties:
                document:
                  description: "Vendor documentation the builder and reviewer read before they start, as repeated file parts: UTF-8 text (.md, .txt, .html, .json, .yaml, .xml, .csv) or PDF (.pdf). The documents share the request body limit."
                  items:
                    contentEncoding: binary
                    contentMediaType: application/octet-stream
                    format: binary
                    type: string
                  type: array
                request:
