              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              examples:
                build_rate_exceeded:
                  $ref: "#/components/examples/build_rate_exceeded"
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds until the daily UTC build allowance resets.
              schema:
                minimum: 1
                type: integer
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
          headers:
            Retry-After:
              description: Seconds to wait before retrying a build after a storage failure or operation timeout. Other service and authentication failures can omit this header.
              schema:
                minimum: 1
                type: integer
