  /v1/worlds:
    get:
      description: Returns all Worlds that the API key can access.
      operationId: list-worlds
      parameters:
        - description: Page size. Values below 1 use 50. Values above 200 use 200.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            type: integer
        - description: Opaque next_cursor value from a previous page.
          explode: false
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWorldsResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                bad_request:
                  $ref: "#/components/examples/bad_request"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          content:
            application/problem+json:
              examples:
                validation:
                  $ref: "#/components/examples/validation"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - apiKeyAuth: []
      summary: List Worlds
      tags:
        - worlds
    post:
      description: Starts an asynchronous World build from one or more ready Simulators and returns the World in the building state. Start the World once it is ready to create its Simulations.
      operationId: build-world
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildWorldRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/World"
          description: Accepted
        "400":
          content:
            application/problem+json:
              examples:
                simulator_unknown:
                  $ref: "#/components/examples/simulator_unknown"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          content:
            application/problem+json:
              examples:
                simulator_not_ready:
                  $ref: "#/components/examples/simulator_not_ready"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          content:
            application/problem+json:
              examples:
                validation:
                  $ref: "#/components/examples/validation"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      security:
        - apiKeyAuth: []
      summary: Build World
      tags:
        - worlds
  /v1/worlds/{id}:
    delete:
      description: Deletes a World, all its Simulations, and their saved runtime states.
      operationId: delete-world
      parameters:
        - description: World ID.
          in: path
          name: id
