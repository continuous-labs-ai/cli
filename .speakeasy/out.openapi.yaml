              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Get Web Box connection
      tags:
        - webbox
      x-speakeasy-retries:
        backoff:
          exponent: 1.5
          initialInterval: 500
          maxElapsedTime: 60000
          maxInterval: 5000
        retryConnectionErrors: true
        statusCodes:
          - "502"
          - "503"
          - "504"
        strategy: backoff
  /v1/webbox/{id}/start:
    post:
      description: Starts a stopped Web Box from the state its stop saved, and returns at once with status starting. A running, starting or stopping Web Box returns 409 webbox_not_stopped.
      operationId: start-webbox
      parameters:
        - description: Web Box ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^wbx_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebBox"
          description: Accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              examples:
                webbox_not_found:
                  $ref: "#/components/examples/webbox_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/problem+json:
              examples:
                webbox_not_stopped:
                  $ref: "#/components/examples/webbox_not_stopped"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "429":
          content:
            application/problem+json:
              examples:
                box_quota_exceeded:
                  $ref: "#/components/examples/box_quota_exceeded"
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
