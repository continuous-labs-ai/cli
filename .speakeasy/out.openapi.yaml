      description: Request Entity Too Large
    RequestTimeout:
      content:
        application/problem+json:
          examples:
            request_timeout:
              $ref: "#/components/examples/request_timeout"
          schema:
            $ref: "#/components/schemas/Error"
      description: Request Timeout
    Unauthorized:
      content:
        application/problem+json:
          examples:
            auth_invalid:
              $ref: "#/components/examples/auth_invalid"
            auth_missing:
              $ref: "#/components/examples/auth_missing"
          schema:
