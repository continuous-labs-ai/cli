      additionalProperties: false
      properties:
        algorithm:
          description: "The JWS algorithm that signs the assertion: PS256 (the default), PS384, PS512, RS256, RS384, RS512, ES256, ES384 or ES512. Only with private_key."
          type: string
        client_id:
          description: The OAuth 2.0 client ID.
          minLength: 1
          type: string
        client_secret:
          description: The client secret. Send exactly one of client_secret and private_key. The API never returns it.
          type: string
          writeOnly: true
        key_id:
          description: The kid header of the assertion, such as the certificate ID NetSuite shows for the uploaded certificate. Only with private_key.
          type: string
        private_key:
          description: "The client's PEM private key (PKCS #8, PKCS #1 or SEC 1), which signs a JWT assertion for each token. Send exactly one of client_secret and private_key. The API never returns it."
