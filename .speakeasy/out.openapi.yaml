  /v1/worlds/{id}/start:
    post:
      description: Starts every Simulation in the World. The first start creates the Simulations; later starts restore them from saved state. The World must be ready or stopped, and the workspace must have room for all members under its active-Simulation limit. A running World is returned unchanged.
      operationId: start-world
      parameters:
        - description: World ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^wld_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/World"
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
