          id: smr_01J8Z5X4K7M2N9P0Q1R2S3T4V5
          instructions: Return stable example data for every operation.
          mode: api
          name: billing-api
          parent_id: smr_01J8Z5X4K7M2N9P0Q1R2S3T4V9
          publication: null
          research: null
          source: workspace
          spec_kind: openapi
          status: building
      properties:
        build:
          description: The build's latest progress report, or null before the first report. A terminal Simulator keeps its last report.
          oneOf:
            - $ref: "#/components/schemas/SimulatorBuildProgress"
            - type: "null"
        created_at:
          description: Simulator creation time.
          format: date-time
          type: string
        credential_ids:
          description: Workspace credentials the build was allowed to call real systems with. Empty when none.
          items:
            type: string
          type: array
        error:
          $ref: "#/components/schemas/SimulatorError"
          description: Why the build failed or was canceled, or null.
        id:
          description: Simulator ID.
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        instructions:
          description: The instructions the build followed, or empty when none were given.
          type: string
        mode:
          description: api for a Simulator of the vendor's API; web_app for one of its logged-in web app.
          enum:
            - api
            - web_app
          type: string
        name:
          description: Simulator name. The ID is its identity, and names need not be unique.
          maxLength: 128
          type: string
        parent_id:
          description: Parent Simulator ID, or null.
          pattern: ^smr_[0-9A-HJKMNP-TV-Z]{26}$
          type:
            - string
            - "null"
        publication:
          description: The latest attempt to publish the Simulator's image into the workspace's default customer runtime environment, or null when the workspace has none, no attempt is recorded, or the response does not report it. Get and list report it.
          oneOf:
            - $ref: "#/components/schemas/SimulatorPublication"
            - type: "null"
        research:
          description: The build's research stage, or null for a Simulator built before research ran on every build.
          oneOf:
            - $ref: "#/components/schemas/SimulatorResearch"
            - type: "null"
        source:
          description: workspace for a Simulator your workspace built; catalog for a read-only Simulator that Continuous publishes.
          enum:
            - workspace
            - catalog
          type: string
        spec_kind:
          description: "The specification the Simulator was built from, or null until a build has read it. recorded is a Web App Simulator's: the app's origin."
          enum:
            - openapi
            - wsdl
            - graphql
            - recorded
            - null
          type:
            - string
            - "null"
        status:
          description: pending while waiting for capacity; building while the build runs; ready when Simulations and incremental builds can use it; failed when the build failed; canceled when a cancel request took effect.
          enum:
            - pending
            - building
            - ready
            - failed
            - canceled
          type: string
      required:
        - id
        - name
        - source
        - spec_kind
        - parent_id
        - instructions
        - status
        - error
        - created_at
        - credential_ids
        - mode
        - build
        - research
        - publication
      type: object
    SimulatorActor:
      additionalProperties: false
      properties:
        default:
          description: Whether a request without the header acts as this caller.
          type: boolean
        entity:
          description: The entity whose row the id keys.
          type: string
        id:
          description: "The value to send in the X-Continuous-Actor header: the key of the identity row the caller acts as."
          type: string
        name:
          description: The build's name for the caller.
          type: string
        role:
          description: The caller's role in the simulated service.
          type: string
      required:
        - id
        - name
        - role
        - entity
        - default
      type: object
    SimulatorBuildProgress:
      additionalProperties: false
      properties:
        hidden_limitations:
          description: Limitations the accepted build records beyond those listed in limitations.
          format: int64
          minimum: 0
          type: integer
        last_submission:
          description: Outcome of the most recent submit attempt, or null.
          enum:
            - accepted
            - rejected
            - null
          type:
            - string
            - "null"
        last_tool:
          description: Name of the most recent tool call, or null. Tool arguments and output are private.
          type:
            - string
            - "null"
        limitations:
          description: Behavior the accepted build does not serve like the real system, most important first, set when the build is accepted. Empty when none.
          items:
            $ref: "#/components/schemas/Limitation"
          maxItems: 50
          type: array
        model:
          description: The model the builder and reviewer run on, or combined, which currently runs as claude-opus-5-5. A build recorded before model selection reports its provider's default.
          enum:
            - gpt-6-astra
            - gpt-6.1-sol
            - claude-opus-5-5
            - claude-fable-5-1
            - gpt-6-sol
            - combined
          type: string
        phase:
          description: "Agent phase: research while the research agent indexes the documents and saves the vendor pages they lack; build for generation, review for the separate reviewer, qa while QA tests the running Simulator from outside, after the last review round of a build with credential_ids, finalize for author repair after review or QA. Null when not recorded."
          enum:
            - research
            - build
            - review
            - qa
            - finalize
            - null
          type:
            - string
            - "null"
        review_round:
          description: Review round that phase review, qa, or finalize belongs to, from 1. In a build with credential_ids, QA and the repair after it are in round review_rounds + 1. 0 before the first review.
          format: int64
          maximum: 11
          minimum: 0
          type: integer
        review_rounds:
          description: Review rounds the build runs at most. Fewer run when the reviewer agrees early.
          format: int64
          maximum: 10
          minimum: 1
          type: integer
        stage:
          description: derive while the effective spec, build skeleton, and sandbox are prepared; build while the coding loop runs; assemble while an accepted artifact publishes.
          enum:
            - derive
            - build
            - assemble
          type: string
        submissions:
          description: Submit attempts.
          format: int64
          minimum: 0
          type: integer
        tool_calls:
          description: Tool calls the coding loop executed.
          format: int64
          minimum: 0
          type: integer
        waited_seconds:
          description: Total seconds of the build's ended waits for its live credentials, which do not count toward its time limit. 0 when none has ended. The current wait, from waiting.since, is not included.
          format: int64
          minimum: 0
          type: integer
        waiting:
          description: Set while the build waits at QA because the live systems rejected its credentials; refresh them, then resume the build with its resource's resume operation, such as POST /v1/simulators/{id}/resume. Null otherwise.
          oneOf:
            - $ref: "#/components/schemas/SimulatorBuildWaiting"
            - type: "null"
        warnings:
          description: Specification defects the build tolerated without changing the specification, set when the build prepares its specification. Empty when none.
          items:
            $ref: "#/components/schemas/SpecificationWarning"
          maxItems: 20
          type: array
      required:
        - model
        - phase
        - review_round
        - review_rounds
        - stage
        - tool_calls
        - submissions
        - last_tool
        - last_submission
        - warnings
        - limitations
        - hidden_limitations
        - waited_seconds
        - waiting
      type: object
    SimulatorBuildWaiting:
      additionalProperties: false
      properties:
        credential_ids:
          description: The credentials to refresh with PATCH /v1/credentials/{id} before resuming the build.
          items:
            type: string
          type: array
        deadline:
          description: "When the wait ends, 7 days after it began: a build not resumed by then fails with error code live_credential_rejected. The wait does not count toward the build's time limit."
          format: date-time
          type: string
        reason:
          description: "Why the build waits: the status and detail of the live reply that rejected QA's authenticated read."
