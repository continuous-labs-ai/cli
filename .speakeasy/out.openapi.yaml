        - pages
        - bytes
      type: object
    BuildWaiting:
      additionalProperties: false
      properties:
        credential_ids:
          description: The credentials to refresh with PATCH /v1/credentials/{id} before resuming the build. Empty for live_rate_limit, unavailable and time_limit.
          items:
            pattern: ^crd_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          type: array
        deadline:
          description: "When the wait ends, 7 days after it began: a build not resumed by then fails with error code live_credential_rejected for live_credentials, live_rate_limited for live_rate_limit, build_failed with reason service_unavailable for unavailable, or build_failed with reason time_limit for time_limit. The wait does not count toward the build's time limit."
          format: date-time
          type: string
        reason:
          description: "Why the build waits: for live_credentials, the status and detail of the live reply that rejected the build's credentials; for live_rate_limit, of the reply that rate limited its calls; for unavailable, what the build could not reach."
          type: string
        since:
          description: When the build started waiting.
          format: date-time
          type: string
        type:
          description: live_credentials while the build waits for the credentials it names to be refreshed; live_rate_limit while it waits for the live system's rate limit to reset; unavailable while it waits for a service it could not reach, such as its live system, its model or sandbox provider, or its own test runner; time_limit while it waits for a resume that adds time with add_seconds.
          enum:
            - live_credentials
            - live_rate_limit
            - unavailable
            - time_limit
          type: string
      required:
        - type
        - reason
        - credential_ids
        - since
        - deadline
      type: object
