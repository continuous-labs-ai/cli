                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Start Web Box
      tags:
        - webbox
  /v1/webbox/{id}/steps:
    get:
      description: Lists the Web Box's steps in order. Each request that changed state is one step; a request that only reads registers none. A Web Box that is not running returns 409 webbox_stopped.
      operationId: list-webbox-steps
      parameters:
        - description: Web Box ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^wbx_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
        - description: Opaque next_cursor value from a previous page.
          explode: false
          in: query
          name: cursor
          schema:
            type: string
        - description: Page size. Values below 1 use 50. Values above 200 use 200.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAPIBoxStepsResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              examples:
                bad_request:
                  $ref: "#/components/examples/bad_request"
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              examples:
                webbox_not_found:
                  $ref: "#/components/examples/webbox_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/problem+json:
              examples:
                webbox_starting:
                  $ref: "#/components/examples/webbox_starting"
                webbox_stopped:
                  $ref: "#/components/examples/webbox_stopped"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/problem+json:
              examples:
                validation_list_limit:
                  $ref: "#/components/examples/validation_list_limit"
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: List Web Box Steps
      tags:
        - webbox
      x-speakeasy-pagination:
        inputs:
          - in: parameters
            name: cursor
            type: cursor
        outputs:
          nextCursor: $.next_cursor
        type: cursor
      x-speakeasy-retries:
        backoff:
          exponent: 1.5
          initialInterval: 500
          maxElapsedTime: 60000
          maxInterval: 5000
        retryConnectionErrors: true
        statusCodes:
          - "502"
          - "503"
          - "504"
        strategy: backoff
  /v1/webbox/{id}/stop:
    post:
      description: "Stops a running Web Box: it saves its state, and releases its runtime. It returns at once with status stopping; get the Web Box until it is stopped. A stopped Web Box is returned unchanged; a starting one returns 409 webbox_starting."
      operationId: stop-webbox
      parameters:
        - description: Web Box ID.
          in: path
          name: id
          required: true
          schema:
            pattern: ^wbx_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebBox"
          description: Accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          content:
            application/problem+json:
              examples:
                webbox_not_found:
                  $ref: "#/components/examples/webbox_not_found"
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/problem+json:
              examples:
                webbox_starting:
                  $ref: "#/components/examples/webbox_starting"
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          content:
            application/problem+json:
              examples:
                auth_provider_unavailable:
                  $ref: "#/components/examples/auth_provider_unavailable"
                internal_unavailable:
                  $ref: "#/components/examples/internal_unavailable"
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKeyAuth: []
      summary: Stop Web Box
      tags:
        - webbox
servers:
  - description: Continuous production API.
    url: https://api.continuouslabs.ai
tags:
  - description: Start API Boxes from API Box Snapshots. Each API Box serves its Snapshot's API at its own endpoint, with its own state, in real time. Stop, start and delete them.
    name: apibox
    x-group: API Boxes
  - description: Build API Box Snapshots from an OpenAPI, WSDL or GraphQL document, or use the catalog's. API Boxes start from a ready Snapshot.
    name: apibox-snapshots
    x-group: API Box Snapshots
  - description: Start Web Boxes from Web Box Snapshots. Each Web Box serves its Snapshot's web app at a host of its own, with its own state, in real time. Stop, start and delete them.
    name: webbox
    x-group: Web Boxes
  - description: Build Web Box Snapshots from a vendor's live web app, or use the catalog's. Web Boxes start from a ready Snapshot.
    name: webbox-snapshots
    x-group: Web Box Snapshots
  - description: Start MCP Boxes from MCP Box Snapshots. Each MCP Box serves its Snapshot's tools over MCP in front of an API Box. Stop, start and delete them.
    name: mcpbox
    x-group: MCP Boxes
  - description: List, rename and delete the MCP Box Snapshots that Continuous publishes into your workspace. Each holds an MCP server's tools, built against an API Box Snapshot.
    name: mcpbox-snapshots
    x-group: MCP Box Snapshots
  - description: Deprecated. Use API Box for APIs and Web Box for web apps. Build Simulators from OpenAPI, WSDL or GraphQL documents, check or cancel a build, clone Simulators into other workspaces, and rename and delete Simulators.
    name: simulators
    x-group: Simulators
  - description: Deprecated. Use API Box for APIs and Web Box for web apps. Create Simulations from ready Simulators or Snapshots, then rename, stop, start, and delete them.
    name: simulations
    x-group: Simulations
  - description: Deprecated. Use API Box for APIs and Web Box for web apps. Save a running Simulation's state as a Snapshot, create Simulations from it, and rename and delete it.
    name: simulation-snapshots
    x-group: Simulation Snapshots
  - description: "Store connections to real systems: a base URL, the header that carries the credential, and its value. The API never returns a value."
    name: credentials
    x-group: Credentials
