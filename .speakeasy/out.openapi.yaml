      description: Unauthorized
    UnsupportedMediaType:
      content:
        application/problem+json:
          examples:
            unsupported_media_type:
              $ref: "#/components/examples/unsupported_media_type"
          schema:
            $ref: "#/components/schemas/Error"
      description: Unsupported Media Type
  schemas:
    APIBox:
      additionalProperties: false
      properties:
        created_at:
          description: API Box creation time.
          format: date-time
          type: string
        endpoint:
          description: Base URL of the API Box's API. Send the API Box's token in X-Continuous-Token.
          type: string
        error:
          $ref: "#/components/schemas/SimulatorError"
          description: Why its last run stopped without a stop request, or null.
        id:
          description: API Box ID.
          pattern: ^abx_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        include_sample_data:
          description: Whether the API Box started with the Snapshot's sample data.
          type: boolean
        metadata:
          description: Customer JSON metadata, or null.
        name:
          description: API Box name. The ID is its identity, and names need not be unique.
          maxLength: 128
          type: string
        snapshot_id:
          description: The API Box Snapshot it started from.
          pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        status:
          description: starting while its runtime boots; running while it serves requests; stopping while it saves its state; stopped when it holds no runtime. A start resumes the saved state.
          enum:
            - starting
            - running
            - stopping
            - stopped
          type: string
      required:
        - id
        - name
        - snapshot_id
        - status
        - endpoint
        - error
        - metadata
        - include_sample_data
        - created_at
      type: object
    APIBoxSnapshot:
      additionalProperties: false
      properties:
        build:
          description: The build's latest progress report, or null before the first report. A settled Snapshot keeps its last report. A build waiting for its live credentials resumes with POST /v1/apibox-snapshots/{id}/resume.
          oneOf:
            - $ref: "#/components/schemas/SimulatorBuildProgress"
            - type: "null"
        composition:
          description: What a ready Snapshot serves, or null.
          oneOf:
            - $ref: "#/components/schemas/SimulatorComposition"
            - type: "null"
        created_at:
          description: Snapshot creation time.
          format: date-time
          type: string
        credential_ids:
          description: Workspace credentials the build was allowed to call real systems with. Empty when none.
          items:
            type: string
          type: array
        error:
          $ref: "#/components/schemas/SimulatorError"
          description: Why the build failed or was canceled, or null.
        hidden_limitations:
          description: Limitations the Snapshot records beyond those listed in limitations.
          format: int64
          minimum: 0
          type: integer
        id:
          description: API Box Snapshot ID.
          pattern: ^abs_[0-9A-HJKMNP-TV-Z]{26}$
          type: string
        instructions:
          description: The instructions the build followed, or empty when none were given.
          type: string
        limitations:
          description: Behavior the Snapshot does not serve like the real system, most important first, whether it was built or published. Empty when none.
          items:
            $ref: "#/components/schemas/Limitation"
          type: array
        metadata:
          description: Customer JSON metadata, or null.
        name:
          description: Snapshot name. The ID is its identity, and names need not be unique.
          maxLength: 128
          type: string
        research:
          description: The build's research stage, or null when research did not run.
          oneOf:
            - $ref: "#/components/schemas/SimulatorResearch"
            - type: "null"
        source:
          description: catalog for a Snapshot Continuous publishes, build for one built or published into the workspace.
          enum:
            - catalog
            - build
          type: string
        spec_kind:
          description: The specification the Snapshot was built from, or null until the build has read it.
          enum:
            - openapi
            - wsdl
            - graphql
            - null
          type:
            - string
            - "null"
        status:
          description: pending while waiting for capacity; building while the build runs; ready when API Boxes can start from it; failed when the build failed; canceled when a cancel request took effect.
          enum:
            - pending
            - building
            - ready
            - failed
            - canceled
          type: string
      required:
        - id
        - name
        - source
        - status
        - spec_kind
        - instructions
        - credential_ids
        - error
        - build
        - research
        - limitations
        - hidden_limitations
        - composition
        - metadata
        - created_at
      type: object
    AdvanceTimeRequest:
      additionalProperties: false
      properties:
        to:
          description: Absolute target time in RFC 3339, with at most millisecond precision.
          format: date-time
          type: string
      required:
        - to
      type: object
    ApiboxConnection:
      additionalProperties: false
      properties:
        endpoint:
          description: Base URL of the API Box's API.
          type: string
        token:
          description: The API Box's token. Send it in X-Continuous-Token on each request to the endpoint.
          type: string
      required:
        - endpoint
        - token
      type: object
    ApiboxStep:
      additionalProperties: false
      properties:
        label:
          description: The request that made the step.
          type: string
        step:
          description: Step number, from 1 in order.
          format: int64
          type: integer
        time:
          description: When the request ran, or null when the runtime did not record it.
          format: date-time
          type:
            - string
            - "null"
      required:
        - step
        - label
        - time
      type: object
    ApiboxTokenResponse:
      additionalProperties: false
      properties:
        apibox:
