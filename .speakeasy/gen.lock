releaseNotes: |
  ## Cli SDK Changes:
  * `ContinuousSimulation.Simulations.MintSimulationToken()`: **Removed** (Breaking ⚠️)
  * `ContinuousSimulation.Simulations.AdvanceSimulation()`:  `response.Members[].Reached` **Added**
  * `ContinuousSimulation.Simulations.GetSimulationAdvance()`:  `response.Members[].Reached` **Added**
  * `ContinuousSimulation.Simulators.ListSimulators()`:  `response.Simulators[].Build.Warnings[].Code` **Changed**
  * `ContinuousSimulation.Simulators.BuildSimulator()`:  `response.Build.Warnings[].Code` **Changed**
  * `ContinuousSimulation.Simulators.GetSimulator()`:  `response.Build.Warnings[].Code` **Changed**
  * `ContinuousSimulation.Simulators.CancelSimulator()`:  `response.Build.Warnings[].Code` **Changed**
  * `ContinuousSimulation.Worlds.AdvanceWorld()`:  `response.Members[].Reached` **Added**
  * `ContinuousSimulation.Worlds.GetWorldAdvance()`:  `response.Members[].Reached` **Added**
