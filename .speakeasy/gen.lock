releaseNotes: "## Cli SDK Changes:\n* `ContinuousSimulation.Simulations.AdvanceSimulationTime()`: **Added**\n* `ContinuousSimulation.Simulations.GetSimulationAdvance()`: **Added**\n* `ContinuousSimulation.Simulations.ListSimulationAdvanceEvents()`: **Added**\n* `ContinuousSimulation.Worlds.AdvanceWorldTime()`: **Added**\n* `ContinuousSimulation.Worlds.GetWorldAdvance()`: **Added**\n* `ContinuousSimulation.Simulations.ListSimulations()`:  `response.Simulations[]` **Changed**\n* `ContinuousSimulation.Simulations.CreateSimulation()`: \n  *  `request.Request.StartTime` **Added**\n  *  `response` **Changed**\n* `ContinuousSimulation.Simulations.GetSimulation()`:  `response` **Changed**\n* `ContinuousSimulation.Simulations.ForkSimulation()`:  `response` **Changed**\n* `ContinuousSimulation.Simulations.StartSimulation()`:  `response` **Changed**\n* `ContinuousSimulation.Simulations.ListSimulationSteps()`:  `response.Steps[]` **Changed**\n* `ContinuousSimulation.Simulations.StopSimulation()`:  `response` **Changed**\n* `ContinuousSimulation.Worlds.ListWorlds()`:  `response.Worlds[]` **Changed**\n* `ContinuousSimulation.Worlds.BuildWorld()`: \n  *  `request.Request.Builder` **Added**\n  *  `response` **Changed**\n* `ContinuousSimulation.Worlds.GetWorld()`:  `response` **Changed**\n* `ContinuousSimulation.Worlds.CancelWorldBuild()`:  `response` **Changed**\n* `ContinuousSimulation.Worlds.StartWorld()`: \n  *  `request.Request.Body` **Added**\n  *  `response` **Changed**\n  *  `error` **Changed**\n* `ContinuousSimulation.Worlds.StopWorld()`:  `response` **Changed**\n"
